<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thanh Toán Nhiên Liệu</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 10px; }
        .container { width: 100%; max-width: 700px; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin: auto; box-sizing: border-box; }
        h2 { text-align: center; color: #c00; margin-top: 0; text-transform: uppercase; font-size: 20px; }
        h3 { color: #0056b3; border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-top: 20px; font-size: 15px; }
        .form-group { margin-bottom: 12px; }
        label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 4px; color: #c00; }
        input, select, textarea { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        button { background: #28a745; color: #fff; border: none; padding: 11px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 8px; border-radius: 6px; font-size: 14px; }
        .btn-blue { background: #007bff; } .btn-orange { background: #fd7e14; } .btn-red { background: #dc3545; }
        .btn-gray { background: #6c757d; } .btn-purple { background: #6f42c1; } .btn-green { background: #20c997; }
        .btn-sm { padding: 5px 10px; font-size: 12px; width: auto; margin: 2px; }

        .xe-card { border: 2px solid #007bff; border-radius: 10px; padding: 12px; margin-bottom: 14px; background: #f9fbff; }
        .xe-card .xe-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px dashed #007bff; }
        .xe-card .xe-title { font-weight: bold; color: #0056b3; font-size: 14px; }
        .xe-card .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
        .xe-card .row label { flex: 0 0 125px; color: #333; font-size: 12px; margin: 0; font-weight: bold; }
        .xe-card .row input, .xe-card .row select { flex: 1; padding: 7px; font-size: 13px; }
        .xe-card .bien-so-text, .xe-card .dinh-muc-text, .xe-card .nhien-lieu-text { flex: 1; font-size: 13px; color: #555; font-style: italic; background: #fff; padding: 7px; border-radius: 4px; border: 1px dashed #ccc; }

        .cong-tac-card { border: 1px solid #28a745; border-radius: 8px; padding: 10px; margin: 10px 0; background: #f0fff4; }
        .cong-tac-card .ct-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .cong-tac-card .ct-title { font-weight: bold; color: #155724; font-size: 13px; }
        .cong-tac-card .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
        .cong-tac-card .row label { flex: 0 0 140px; color: #333; font-size: 12px; margin: 0; font-weight: bold; }
        .cong-tac-card .row input { flex: 1; padding: 6px; font-size: 13px; }
        .cong-tac-card .kq { background: #fff; padding: 6px; border-radius: 4px; border: 1px dashed #28a745; font-size: 12px; margin-top: 6px; }

        .xe-tong { background: #e7f1ff; padding: 8px; border-radius: 6px; margin-top: 10px; font-weight: bold; color: #0056b3; text-align: right; font-size: 13px; }

        .info-text { font-size: 12px; color: #666; font-style: italic; }
        #loading { display: none; position: fixed; inset: 0; z-index: 99999; background: rgba(255,255,255,.9); align-items: center; justify-content: center; color: #007bff; font-weight: bold; font-size: 18px; }
        .note { font-size: 11px; color: #666; font-style: italic; margin: 4px 0; }
        .header-actions { display: flex; gap: 6px; margin-bottom: 10px; }
        .header-actions button { margin: 0; padding: 8px; font-size: 12px; }

        .ct-banner { background: linear-gradient(135deg, #007bff, #0056b3); color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .ct-banner .ct-id { font-family: monospace; font-size: 11px; opacity: .85; }
        .ct-banner .ct-ten { font-weight: bold; font-size: 14px; margin-top: 4px; }
        .ct-banner .ct-back { display: inline-block; color: #fff; text-decoration: none; font-size: 12px; margin-bottom: 6px; opacity: .9; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <button class="btn-blue" onclick="luuForm()">💾 Lưu</button>
        <button class="btn-red" onclick="location.href='index.html'">← Trang chủ</button>
    </div>

    <div class="ct-banner">
        <a href="index.html" class="ct-back">← Quay lại danh sách</a>
        <div class="ct-id" id="bannerId"></div>
        <div class="ct-ten" id="bannerTen"></div>
    </div>

    <h2>BẢNG THANH TOÁN NHIÊN LIỆU</h2>

    <div class="form-group">
        <label>Ngày thanh toán:</label>
        <input type="date" id="ngayThanhToan">
    </div>

    <div id="dsXeContainer"></div>

    <button class="btn-purple" onclick="addXe()">+ Thêm xe</button>
    <button class="btn-orange" onclick="xuatTatCa()">📄 Xuất tất cả (mỗi xe 1 file Word)</button>
</div>

<div id="loading">⏳ Đang xử lý, chờ xíu...</div>

<script>
    // ============ URL PARAM + DB ============
    const CT_ID = new URLSearchParams(location.search).get('id');
    if (!CT_ID) { alert("Thiếu ID công tác!"); location.href = 'index.html'; }

    let dbCongTac = JSON.parse(localStorage.getItem('db_congtac') || '{}');
    if (!dbCongTac[CT_ID]) { alert("Công tác không tồn tại!"); location.href = 'index.html'; }
    let CT = dbCongTac[CT_ID];
    const DC = CT.decuong || {};
    const DX = CT.dieuxe || {};

    // ============ CẤU HÌNH ============
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlM-814su7_q0yS7Qx1bdwC1j9CB18Km6UOdMcJW4ifZUecl633RmEhvxnsUIwerlE/exec";
    const ID_TEMPLATE_THANHTOAN = "1y1HLSa4oSuZ-siop03b9XL14azE8pVHC";

    const DEFAULT_XE = [
        { ten: "Ford Transit",   bienSo: "79B 877.43",  dinhMuc: 19, nhienLieu: "Dầu" },
        { ten: "Ford Ranger",    bienSo: "79C 038.20",  dinhMuc: 15, nhienLieu: "Dầu" },
        { ten: "Toyota Fortuner",  bienSo: "79A 686.17",  dinhMuc: 19, nhienLieu: "Xăng" }
    ];

    // ============ STATE ============
    let dsXeGoc = [];
    let dsLaiXe = [];
    let dsCongTacGoiY = [];

    // ============ KHỞI TẠO ============
    window.onload = function() {
        dsXeGoc = JSON.parse(localStorage.getItem('ds_xe_goc')) || DEFAULT_XE.slice();

        document.getElementById('bannerId').innerText = CT_ID;
        document.getElementById('bannerTen').innerText = CT.tenCongTac || '';

        if (DC.selectedRoles) {
            dsLaiXe = Object.keys(DC.selectedRoles).filter(n => DC.selectedRoles[n] === 'LX');
        }
        if (dsLaiXe.length === 0) dsLaiXe = ["Nguyễn Mạnh Hiệp", "Mai Văn Giáp"];

        dsCongTacGoiY = [];
        if (DC.ndCongTac) dsCongTacGoiY.push(DC.ndCongTac);
        (DX.xeList || []).forEach(x => {
            (x.noiDung || []).forEach(nd => { if (nd && !dsCongTacGoiY.includes(nd)) dsCongTacGoiY.push(nd); });
        });
        renderDatalists();

        const today = new Date();
        document.getElementById('ngayThanhToan').value =
            `${today.getFullYear()}-${('0'+(today.getMonth()+1)).slice(-2)}-${('0'+today.getDate()).slice(-2)}`;

        if (CT.nhienlieu && CT.nhienlieu.xeList && CT.nhienlieu.xeList.length > 0) {
            document.getElementById('ngayThanhToan').value = CT.nhienlieu.ngayThanhToan || document.getElementById('ngayThanhToan').value;
            CT.nhienlieu.xeList.forEach(x => addXe(x));
        } else {
            autoFillFromDeCuong();
        }
    };

    // ===== AUTO ĐIỀN TỪ ĐỀ CƯƠNG =====
    function autoFillFromDeCuong() {
        const soXe = DC.xeList && DC.xeList.length > 0 ? DC.xeList.length : 1;
        for (let i = 0; i < soXe; i++) {
            const xeDC = DC.xeList && DC.xeList[i] ? DC.xeList[i] : null;
            if (!xeDC) { addXe(); continue; }
            const xeGoc = dsXeGoc.find(x => x.bienSo === xeDC.bienSo);
            const dinhMuc = xeGoc ? xeGoc.dinhMuc : 15;
            const nhienLieu = xeGoc ? xeGoc.nhienLieu : 'Dầu';
            const congTacAuto = [{
                ten_ct: DC.ndCongTac || '',
                so_km_dau: 0,
                so_km: xeDC.soKm || 0
            }];
            addXe({
                xeIdx: xeDC.xeIdx || '',
                bienSo: xeDC.bienSo || '',
                dinhMuc: dinhMuc,
                nhienLieu: nhienLieu,
                laiXe: xeDC.laiXe || (dsLaiXe[i] || ''),
                congTacList: congTacAuto
            });
        }
    }

    // ============ QUẢN LÝ XE ============
    function addXe(xData = null) {
        const container = document.getElementById('dsXeContainer');
        const idx = container.children.length + 1;
        const card = document.createElement('div');
        card.className = 'xe-card';
        card.innerHTML = `
            <div class="xe-header">
                <span class="xe-title">🚗 Xe ${idx}</span>
                <button class="btn-red btn-sm" onclick="this.closest('.xe-card').remove(); capNhatSoXe();">Xóa</button>
            </div>
            <div class="row">
                <label>Chọn xe:</label>
                <select class="chon-xe" onchange="capNhatXe(this)">
                    <option value="">-- Chọn --</option>
                    ${dsXeGoc.map((x, i) => `<option value="${i}" ${xData && String(xData.xeIdx) === String(i) ? 'selected' : ''}>${x.ten}</option>`).join('')}
                </select>
            </div>
            <div class="row"><label>Biển số:</label><span class="bien-so-text">${xData && xData.bienSo ? xData.bienSo : '--'}</span></div>
            <div class="row"><label>Định mức:</label><span class="dinh-muc-text">${xData && xData.dinhMuc ? xData.dinhMuc + ' L/100km' : '--'}</span></div>
            <div class="row"><label>Nhiên liệu:</label><span class="nhien-lieu-text">${xData && xData.nhienLieu ? xData.nhienLieu : '--'}</span></div>
            <div class="row">
                <label>Lái xe:</label>
                <input type="text" class="lai-xe" list="dsLaiXeList" placeholder="Gõ hoặc chọn..." value="${xData && xData.laiXe ? xData.laiXe : ''}">
            </div>
            <div class="row">
                <label>Số lệnh điều xe:</label>
                <input type="text" class="so-lenh" placeholder="VD: 301" value="${xData && xData.soLenh ? xData.soLenh : ''}">
            </div>
            <div class="row">
                <label>Ngày lệnh điều xe:</label>
                <input type="date" class="ngay-lenh" value="${xData && xData.ngayLenh ? xData.ngayLenh : ''}">
            </div>

            <div style="margin-top:10px; padding-top:10px; border-top:1px dashed #28a745;">
                <label style="color:#155724;">▼ Danh sách công tác:</label>
                <div class="ds-cong-tac"></div>
                <button class="btn-green btn-sm" onclick="addCongTac(this)">+ Thêm công tác</button>
            </div>

            <div class="xe-tong">
                Tổng km di chuyển: <span class="tong-km-di">0</span> |
                Tổng km sau: <span class="tong-km-sau">0</span> |
                Tổng lít: <span class="tong-lit">0,0</span>
            </div>
        `;
        container.appendChild(card);

        if (xData && xData.congTacList && xData.congTacList.length > 0) {
            xData.congTacList.forEach(ct => addCongTac(card.querySelector('.btn-green'), ct));
        } else {
            addCongTac(card.querySelector('.btn-green'));
        }

        capNhatSoXe();
    }

    function capNhatSoXe() {
        document.querySelectorAll('.xe-card').forEach((c, i) => c.querySelector('.xe-title').innerText = `🚗 Xe ${i + 1}`);
    }

    function capNhatXe(select) {
        const idx = select.value;
        const card = select.closest('.xe-card');
        if (idx === "") {
            card.querySelector('.bien-so-text').innerText = "--";
            card.querySelector('.dinh-muc-text').innerText = "--";
            card.querySelector('.nhien-lieu-text').innerText = "--";
        } else {
            const xe = dsXeGoc[idx];
            card.querySelector('.bien-so-text').innerText = xe.bienSo;
            card.querySelector('.dinh-muc-text').innerText = xe.dinhMuc + " L/100km";
            card.querySelector('.nhien-lieu-text').innerText = xe.nhienLieu || "Dầu";
        }
        tinhToanXe(card);
    }

    // ============ QUẢN LÝ CÔNG TÁC ============
    function addCongTac(btn, ctData = null) {
        const xeCard = btn.closest('.xe-card');
        const container = xeCard.querySelector('.ds-cong-tac');
        const ctCard = document.createElement('div');
        ctCard.className = 'cong-tac-card';
        ctCard.innerHTML = `
            <div class="ct-header">
                <span class="ct-title">Công tác</span>
                <button class="btn-red btn-sm" onclick="this.closest('.cong-tac-card').remove(); tinhToanXe(this);">Xóa</button>
            </div>
            <div class="row">
                <label>Tên công tác:</label>
                <input type="text" class="ten-ct" list="dsCongTacList" placeholder="Nhập hoặc chọn..." value="${ctData ? (ctData.ten_ct || '').replace(/"/g,'&quot;') : ''}">
            </div>
            <div class="row">
                <label>Số km đầu:</label>
                <input type="number" class="so-km-dau" value="${ctData ? (ctData.so_km_dau || 0) : 0}" onchange="tinhToanXe(this)">
            </div>
            <div class="row">
                <label>Số km di chuyển:</label>
                <input type="number" class="so-km" value="${ctData ? ctData.so_km : 0}" onchange="tinhToanXe(this)">
            </div>
            <div class="kq"></div>
        `;
        container.appendChild(ctCard);
        capNhatSoCongTac(xeCard);
        tinhToanXe(ctCard);
    }

    function capNhatSoCongTac(xeCard) {
        xeCard.querySelectorAll('.cong-tac-card').forEach((ct, i) => {
            ct.querySelector('.ct-title').innerText = `Công tác ${i + 1}`;
        });
    }

    // ============ TÍNH TOÁN ============
    function tinhToanXe(el) {
        const xeCard = el.closest ? el.closest('.xe-card') : el;
        if (!xeCard) return;

        const dinhMucText = xeCard.querySelector('.dinh-muc-text').innerText;
        const dinhMuc = parseFloat(dinhMucText) || 0;

        let tongKmDi = 0;
        let tongKmSau = 0;
        let tongLit = 0;

        xeCard.querySelectorAll('.cong-tac-card').forEach(ct => {
            const soKmDau = +ct.querySelector('.so-km-dau').value || 0;
            const soKm = +ct.querySelector('.so-km').value || 0;
            const soKmSau = soKmDau + soKm;
            const soLit = Math.round((soKm * dinhMuc / 100) * 10) / 10;

            tongKmDi += soKm;
            tongKmSau += soKmSau;
            tongLit += soLit;

            ct.querySelector('.kq').innerHTML = `
                Km sau: <b>${soKmSau.toLocaleString('vi-VN')}</b> km |
                Tiêu thụ: <b>${soLit.toLocaleString('vi-VN', {minimumFractionDigits:1, maximumFractionDigits:1})}</b> lít
            `;
        });

        xeCard.querySelector('.tong-km-di').innerText = tongKmDi.toLocaleString('vi-VN');
        xeCard.querySelector('.tong-km-sau').innerText = tongKmSau.toLocaleString('vi-VN');
        xeCard.querySelector('.tong-lit').innerText = tongLit.toLocaleString('vi-VN', {minimumFractionDigits:1, maximumFractionDigits:1});
    }

    // ============ DATALIST ============
    function renderDatalists() {
        let dl = document.getElementById('dsLaiXeList');
        if (!dl) { dl = document.createElement('datalist'); dl.id = 'dsLaiXeList'; document.body.appendChild(dl); }
        dl.innerHTML = dsLaiXe.map(n => `<option value="${n}">`).join('');

        let dl2 = document.getElementById('dsCongTacList');
        if (!dl2) { dl2 = document.createElement('datalist'); dl2.id = 'dsCongTacList'; document.body.appendChild(dl2); }
        dl2.innerHTML = dsCongTacGoiY.map(n => `<option value="${n.replace(/"/g,'&quot;')}">`).join('');
    }

    // ============ ĐỊNH DẠNG NGÀY ============
    function formatDate(str) {
        if (!str) return "";
        const d = new Date(str);
        return `${('0'+d.getDate()).slice(-2)}/${('0'+(d.getMonth()+1)).slice(-2)}/${d.getFullYear()}`;
    }
    function splitDate(str) {
        if (!str) return { ngay: "", thang: "", nam: "" };
        const d = new Date(str);
        return {
            ngay: ('0'+d.getDate()).slice(-2),
            thang: ('0'+(d.getMonth()+1)).slice(-2),
            nam: d.getFullYear()
        };
    }

    // ============ LƯU ============
    function luuForm() {
        const xeList = [];
        document.querySelectorAll('.xe-card').forEach(card => {
            const congTacList = [];
            card.querySelectorAll('.cong-tac-card').forEach(ct => {
                congTacList.push({
                    ten_ct: ct.querySelector('.ten-ct').value,
                    so_km_dau: ct.querySelector('.so-km-dau').value,
                    so_km: ct.querySelector('.so-km').value
                });
            });
            xeList.push({
                xeIdx: card.querySelector('.chon-xe').value,
                bienSo: card.querySelector('.bien-so-text').innerText,
                dinhMuc: card.querySelector('.dinh-muc-text').innerText,
                nhienLieu: card.querySelector('.nhien-lieu-text').innerText,
                laiXe: card.querySelector('.lai-xe').value,
                soLenh: card.querySelector('.so-lenh').value,
                ngayLenh: card.querySelector('.ngay-lenh').value,
                congTacList: congTacList
            });
        });
        dbCongTac[CT_ID].nhienlieu = {
            ngayThanhToan: document.getElementById('ngayThanhToan').value,
            xeList: xeList
        };
        localStorage.setItem('db_congtac', JSON.stringify(dbCongTac));
       // alert("✅ Đã lưu Thanh toán nhiên liệu!");
    }

    // ============ XUẤT WORD ============
    async function xuatTatCa() {
        luuForm();
        const cards = document.querySelectorAll('.xe-card');
        if (cards.length === 0) { alert("Chưa có xe!"); return; }

        document.getElementById("loading").style.display = "flex";
        const ngayObj = splitDate(document.getElementById('ngayThanhToan').value);

        const danhSachXeData = [];

        cards.forEach(card => {
            const bienSo = card.querySelector('.bien-so-text').innerText;
            if (!bienSo || bienSo === '--') return;

           const dinhMuc = parseFloat(card.querySelector('.dinh-muc-text').innerText) || 0;
const tenXe = card.querySelector('.chon-xe').selectedOptions[0]?.text || "";
const laiXe = card.querySelector('.lai-xe').value;
const nhienLieu = card.querySelector('.nhien-lieu-text').innerText;
const soLenh = card.querySelector('.so-lenh').value;
const ngayLenh = card.querySelector('.ngay-lenh').value;

const dongChiTiet = [];        // ← khai báo TRƯỚC
let tongKmDi = 0, tongKmSau = 0, tongLit = 0;

card.querySelectorAll('.cong-tac-card').forEach(ct => {
    const tenCT = ct.querySelector('.ten-ct').value;
    const soKmDau = +ct.querySelector('.so-km-dau').value || 0;
    const soKm = +ct.querySelector('.so-km').value || 0;
    const soKmSau = soKmDau + soKm;
    const soLit = Math.round((soKm * dinhMuc / 100) * 10) / 10;

    tongKmDi += soKm;
    tongKmSau += soKmSau;
    tongLit += soLit;

    dongChiTiet.push({
        ten_cong_tac: tenCT,
        so_km_dau: soKmDau.toLocaleString('vi-VN'),
        so_km: soKm.toLocaleString('vi-VN'),
        so_km_sau: soKmSau.toLocaleString('vi-VN'),
        dinh_muc: dinhMuc,
        so_lit: soLit.toLocaleString('vi-VN', {minimumFractionDigits:1, maximumFractionDigits:1})
    });
});

// ← SAU KHI vòng lặp xong mới tính tenCongTacNgoai
const tenCongTacNgoai = dongChiTiet
    .map(x => x.ten_cong_tac)
    .filter(v => v)
    .join(', ');

            danhSachXeData.push({
                bien_so: bienSo,
                ten_xe: tenXe,
                lai_xe: laiXe,
                nhien_lieu: nhienLieu,
                so_lenh: soLenh,
                ngay_lenh: ngayLenh ? formatDate(ngayLenh) : '',
                ngay_tt: ngayObj.ngay,
                thang_tt: ngayObj.thang,
                nam_tt: ngayObj.nam,
                dia_diem_tong_hop: DC.diaDiem || "các trạm biến áp theo lệnh điều xe",
                dong_chi_tiet: dongChiTiet,
                ten_cong_tac_ngoai: tenCongTacNgoai,   // ← THÊM DÒNG NÀY
                tong_km_di: tongKmDi.toLocaleString('vi-VN'),
                tong_km_sau: tongKmSau.toLocaleString('vi-VN'),
                tong_so_lit: tongLit.toLocaleString('vi-VN', {minimumFractionDigits:1, maximumFractionDigits:1})
            });
        });

        if (danhSachXeData.length === 0) {
            alert("Chưa chọn xe nào!");
            document.getElementById("loading").style.display = "none";
            return;
        }

        try {
            const res = await fetch(`${GOOGLE_WEB_APP_URL}?action=getTemplate&fileId=${ID_TEMPLATE_THANHTOAN}`);
            const result = await res.json();
            const binary = window.atob(result.base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

            for (let i = 0; i < danhSachXeData.length; i++) {
                const data = danhSachXeData[i];
                const zip = new PizZip(bytes.buffer);
                const doc = new window.docxtemplater(zip, {
                    paragraphLoop: true,
                    linebreaks: true,
                    delimiters: { start: '{', end: '}' },
                    nullGetter: () => ""
                });
                doc.render(data);

                const blob = doc.getZip().generate({
                    type: "blob",
                    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                });
                await new Promise(r => setTimeout(r, 200));
                saveAs(blob, `Thanh_toan_nhien_lieu_${data.bien_so.replace(/\s/g, '_')}.docx`);
            }

            document.getElementById("loading").style.display = "none";
            alert(`✅ Đã xuất ${danhSachXeData.length} file!`);
        } catch (e) {
            console.error(e);
            alert("Lỗi: " + e.message);
            document.getElementById("loading").style.display = "none";
        }
    }
</script>
</body>
</html>
