<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danh Sách Nhóm Công Tác</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 10px; }
        .container { width: 100%; max-width: 720px; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin: auto; box-sizing: border-box; }
        h2 { text-align: center; color: #c00; margin-top: 0; text-transform: uppercase; font-size: 20px; }
        h3 { color: #0056b3; border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-top: 20px; font-size: 15px; }
        .form-group { margin-bottom: 12px; }
        label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 4px; color: #c00; }
        input, select { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        button { background: #28a745; color: #fff; border: none; padding: 11px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 8px; border-radius: 6px; font-size: 14px; }
        .btn-blue { background: #007bff; } .btn-orange { background: #fd7e14; } .btn-red { background: #dc3545; }
        .btn-gray { background: #6c757d; } .btn-purple { background: #6f42c1; }
        .btn-sm { padding: 5px 10px; font-size: 12px; width: auto; margin: 2px; }

        .chip-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
        .chip { position: relative; padding: 8px 4px; border-radius: 18px; border: 2px solid #ccc; background: #f4f4f4; color: #666; font-size: 12px; cursor: pointer; text-align: center; font-weight: normal; transition: .15s; }
        .chip.selected { background: #007bff; color: #fff; border-color: #007bff; font-weight: bold; }
        .chip .driver-icon { position: absolute; top: -6px; right: -4px; font-size: 13px; }
        .chip .role-badge { display: block; font-size: 9px; margin-top: 1px; font-weight: bold; }
        .info-text { font-size: 12px; color: #666; font-style: italic; }

        table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
        th, td { border: 1px solid #999; padding: 4px; text-align: center; }
        th { background: #e9ecef; font-size: 11px; }
        td input { padding: 4px; font-size: 12px; border: 1px solid #ddd; }

        .header-actions { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .header-actions button { margin: 0; padding: 8px; font-size: 12px; flex: 1; min-width: 100px; }
        #loading { display: none; position: fixed; inset: 0; z-index: 99999; background: rgba(255,255,255,.9); align-items: center; justify-content: center; color: #007bff; font-weight: bold; font-size: 18px; }
        .note { font-size: 11px; color: #666; font-style: italic; margin: 4px 0; }

        .ct-banner { background: linear-gradient(135deg, #007bff, #0056b3); color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .ct-banner .ct-id { font-family: monospace; font-size: 11px; opacity: .85; }
        .ct-banner .ct-ten { font-weight: bold; font-size: 14px; margin-top: 4px; }
        .ct-banner .ct-back { display: inline-block; color: #fff; text-decoration: none; font-size: 12px; margin-bottom: 6px; opacity: .9; }

        .trung-badge { display: inline-block; background: #dc3545; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; }

        .warning-box { background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
        .warning-box b { color: #856404; }
        .warning-box ul { margin: 6px 0 0 20px; padding: 0; color: #856404; }

        .total-ctp { background: #fff3cd; font-weight: bold; padding: 8px; text-align: right; border-radius: 6px; margin-top: 8px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <button class="btn-blue" onclick="luuForm()">💾 Lưu</button>
        <button class="btn-red" onclick="location.href='index.html'">← Trang chủ</button>
    </div>

    <div class="ct-banner">
        <a href="index.html" class="ct-back">← Quay lại danh sách</a>
        <div class="ct-id" id="bannerId"></div>
        <div class="ct-ten" id="bannerTen"></div>
    </div>

    <h2>DANH SÁCH NHÓM CÔNG TÁC</h2>

    <div class="form-group">
        <label>Kèm giấy đi đường số:</label>
        <input type="text" id="soGiay" value="301">
    </div>
    <div class="form-group">
        <label>Ngày giấy đi đường:</label>
        <input type="text" id="ngayGiay" placeholder="dd/mm/yyyy">
    </div>

    <h3>Chọn nhân sự</h3>
    <p class="note">Chip xanh = đã chọn. Chip 🚗 = lái xe mặc định. Bấm để thêm/bỏ.</p>
    <div class="chip-group" id="nvChipContainer"></div>

    <div id="warningBox"></div>

    <h3>Danh sách đã chọn</h3>
    <div style="overflow-x:auto;">
        <table id="tblNhanSu">
            <thead>
                <tr>
                    <th style="width:80px;">Họ và Tên</th>
                    <th style="width:100px;">Từ ngày</th>
                    <th style="width:100px;">Đến ngày</th>
                    <th style="width:50px;">Số ngày</th>
                    <th style="width:90px;">Tiền CTP</th>
                    <th>Ghi chú</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <td colspan="4" style="text-align:right; font-weight:bold;">TỔNG CỘNG:</td>
                    <td id="tongCTP" style="font-weight:bold; color:#d63384;">0</td>
                    <td></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <button class="btn-orange" onclick="xuatWord()" style="margin-top:15px;">📄 Xuất Danh sách Word</button>
</div>

<div id="loading">⏳ Đang xử lý, chờ xíu...</div>

<script>
    // ============ URL PARAM + DB ============
    const CT_ID = new URLSearchParams(location.search).get('id');
    if (!CT_ID) { alert("Thiếu ID công tác!"); location.href = 'index.html'; }

    let dbCongTac = JSON.parse(localStorage.getItem('db_congtac') || '{}');
    if (!dbCongTac[CT_ID]) { alert("Công tác không tồn tại!"); location.href = 'index.html'; }
    let CT = dbCongTac[CT_ID];
    const DC = CT.decuong || {};

    // ============ CẤU HÌNH ============
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlM-814su7_q0yS7Qx1bdwC1j9CB18Km6UOdMcJW4ifZUecl633RmEhvxnsUIwerlE/exec";
    const ID_TEMPLATE_DANHSACH = "1va7JNZN7OQsAtsZq6-SMbDN7eLJ-kyyf";

    const DEFAULT_NV = [
        "Nguyễn Hữu Kính","Hoàng Trần Quản Trọng","Ngô Văn Quang","Trần Văn Hoàng",
        "Kim Văn Quỳnh","Hồ Văn Huy","Lê Hữu Anh","Trần Phúc Linh","Tạ Quốc Đạt",
        "Võ Ngọc Sơn","Nguyễn Xuân Khánh","Đoàn Hoàng Quang Định","Võ Văn Sỹ",
        "Lưu Đức Minh","Nguyễn Mạnh Hiệp","Mai Văn Giáp","Nguyễn Thị Thanh Hương",
        "Phan Đình Minh","Nguyễn Thanh Loan","Lê Thị Hoa","Trần Thị Mai",
        "Phạm Văn Bình","Hoàng Văn Nam"
    ];
    const DEFAULT_DRIVERS = ["Nguyễn Mạnh Hiệp", "Mai Văn Giáp"];
    const CHUC_VU_MAC_DINH = {
        "Nguyễn Hữu Kính": "Tổ trưởng",
        "Hoàng Trần Quản Trọng": "Tổ phó",
        "Ngô Văn Quang": "Tổ phó"
    };
    const ROLE_LABEL = { 'NV': 'NV', 'CHT': 'Chỉ huy', 'LĐCV': 'LĐCV', 'LX': 'Lái xe' };

    const MUC_CTP_1_NGAY = 100000;
    const MUC_CTP_NHIEU_NGAY = 250000;

    // ============ STATE ============
    let dsNVGoc = [];
    let dsDangChon = []; // [{ten, tuNgay, denNgay, ghiChu}]

    // ============ ĐỊNH DẠNG NGÀY ============
    function toDisplayDate(str) {
        if (!str) return "";
        if (str.includes('T')) str = str.split('T')[0];
        if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
            const [y, m, d] = str.split(' ')[0].split('-');
            return `${d}/${m}/${y}`;
        }
        return str;
    }

    // Parse về Date để tính toán
    function parseDate(str) {
        if (!str) return null;
        if (str.includes('/')) {
            const [d, m, y] = str.split('/');
            return new Date(`${y}-${m}-${d}`);
        }
        return new Date(str);
    }

    // ============ TÍNH SỐ NGÀY ============
    function tinhSoNgay(tuNgay, denNgay) {
        const d1 = parseDate(tuNgay);
        const d2 = parseDate(denNgay);
        if (!d1 || !d2 || isNaN(d1) || isNaN(d2)) return 0;
        const diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
        return diff > 0 ? diff : 1;
    }

    // ============ TÍNH CTP 1 NGƯỜI ============
    function tinhCTP(soNgay) {
        if (soNgay === 0) return 0;
        if (soNgay === 1) return MUC_CTP_1_NGAY;
        return soNgay * MUC_CTP_NHIEU_NGAY;
    }

    // ============ LIỆT KÊ NGÀY ============
    function lietKeNgay(tuNgay, denNgay) {
        const d1 = parseDate(tuNgay);
        const d2 = parseDate(denNgay);
        if (!d1 || !d2 || isNaN(d1) || isNaN(d2)) return [];
        const list = [];
        const cur = new Date(d1);
        while (cur <= d2) {
            list.push(`${cur.getFullYear()}-${('0'+(cur.getMonth()+1)).slice(-2)}-${('0'+cur.getDate()).slice(-2)}`);
            cur.setDate(cur.getDate() + 1);
        }
        return list;
    }

    // ============ KIỂM TRA TRÙNG NGÀY (với các CT khác) ============
    function kiemTraTrungNgay(ten, ngayList) {
        // Tìm trong tất cả công tác KHÁC
        const dsTrung = [];
        Object.keys(dbCongTac).forEach(otherId => {
            if (otherId === CT_ID) return;
            const other = dbCongTac[otherId];
            if (!other.danhsach || !other.danhsach.danhSach) return;
            const otherNguoi = other.danhsach.danhSach.find(n => n.ten === ten);
            if (!otherNguoi) return;
            const otherNgayList = lietKeNgay(otherNguoi.tuNgay, otherNguoi.denNgay);
            const trungNgay = ngayList.filter(ng => otherNgayList.includes(ng));
            if (trungNgay.length > 0) {
                dsTrung.push({ ctId: otherId, soNgayTrung: trungNgay.length });
            }
        });
        return dsTrung;
    }

    // ============ KHỞI TẠO ============
    window.onload = function() {
        dsNVGoc = JSON.parse(localStorage.getItem('ds_nv_goc')) || DEFAULT_NV.slice();

        document.getElementById('bannerId').innerText = CT_ID;
        document.getElementById('bannerTen').innerText = CT.tenCongTac || '';

        // Ngày giấy = hôm nay
        const today = new Date();
        document.getElementById('ngayGiay').value = toDisplayDate(
            `${today.getFullYear()}-${('0'+(today.getMonth()+1)).slice(-2)}-${('0'+today.getDate()).slice(-2)}`
        );

        // Load dữ liệu đã lưu hoặc auto-fill
        if (CT.danhsach && CT.danhsach.danhSach && CT.danhsach.danhSach.length > 0) {
            document.getElementById('soGiay').value = CT.danhsach.soGiay || '301';
            document.getElementById('ngayGiay').value = CT.danhsach.ngayGiay || document.getElementById('ngayGiay').value;
            dsDangChon = CT.danhsach.danhSach;
        } else {
            autoFillFromDeCuong();
        }

        renderChips();
        renderBang();
    };

    // ===== AUTO ĐIỀN TỪ ĐỀ CƯƠNG =====
    function autoFillFromDeCuong() {
        if (!DC.selectedRoles || Object.keys(DC.selectedRoles).length === 0) return;

        const tuNgay = toDisplayDate(DC.tgTu) || toDisplayDate(CT.ngayBatDau);
        const denNgay = toDisplayDate(DC.tgDen) || toDisplayDate(CT.ngayKetThuc);

        const order = { "Tổ trưởng": 1, "Tổ phó": 2, "Lãnh đạo": 3, "Nhân viên": 4 };
        const dsNguoi = Object.keys(DC.selectedRoles).sort((a, b) => {
            const cvA = CHUC_VU_MAC_DINH[a] || "Nhân viên";
            const cvB = CHUC_VU_MAC_DINH[b] || "Nhân viên";
            return (order[cvA] || 9) - (order[cvB] || 9);
        });

        dsDangChon = dsNguoi.map(ten => ({
            ten: ten,
            tuNgay: tuNgay,
            denNgay: denNgay,
            ghiChu: ""
        }));
    }

    // ============ CHIP ============
    function getShortName(full) {
        const p = full.split(' ');
        return p[p.length - 1];
    }
    function isFemale(name) {
        return name.includes("Thị") || name.startsWith("Lê Thị") || name.startsWith("Trần Thị");
    }
    function isChosen(name) {
        return dsDangChon.some(n => n.ten === name);
    }

    function renderChips() {
        const container = document.getElementById('nvChipContainer');
        container.innerHTML = dsNVGoc.map(nv => {
            const sel = isChosen(nv) ? 'selected' : '';
            const prefix = isFemale(nv) ? "Mrs." : "Mr.";
            const icon = DEFAULT_DRIVERS.includes(nv) ? `<span class="driver-icon">🚗</span>` : "";
            const role = DC.selectedRoles && DC.selectedRoles[nv] ? DC.selectedRoles[nv] : '';
            const badge = role ? `<span class="role-badge">${ROLE_LABEL[role] || role}</span>` : "";
            return `<button type="button" class="chip ${sel}" onclick="toggleNguoi('${nv.replace(/'/g, "\\'")}')">${prefix}${getShortName(nv)}${icon}${badge}</button>`;
        }).join('');
    }

    function toggleNguoi(ten) {
        if (isChosen(ten)) {
            dsDangChon = dsDangChon.filter(n => n.ten !== ten);
        } else {
            const tuNgay = toDisplayDate(DC.tgTu) || toDisplayDate(CT.ngayBatDau);
            const denNgay = toDisplayDate(DC.tgDen) || toDisplayDate(CT.ngayKetThuc);
            dsDangChon.push({
                ten: ten,
                tuNgay: tuNgay,
                denNgay: denNgay,
                ghiChu: ""
            });
        }
        renderChips();
        renderBang();
    }

    // ============ RENDER BẢNG ============
    function renderBang() {
        const tbody = document.querySelector('#tblNhanSu tbody');
        tbody.innerHTML = '';
        let tongCTP = 0;

        dsDangChon.forEach((n, i) => {
            const soNgay = tinhSoNgay(n.tuNgay, n.denNgay);
            let ctp = tinhCTP(soNgay);

            // Kiểm tra trùng ngày với CT khác → CTP = 0 + ghi chú
            const ngayList = lietKeNgay(n.tuNgay, n.denNgay);
            const dsTrung = kiemTraTrungNgay(n.ten, ngayList);
            let autoGhiChu = "";
            let ctpDisplay = ctp;

            if (dsTrung.length > 0) {
                autoGhiChu = `Đã tính ở ${dsTrung.map(x => x.ctId).join(', ')}`;
                ctpDisplay = 0; // A2: CTP = 0
            }

            tongCTP += ctpDisplay;
            const displayName = (isFemale(n.ten) ? "Mrs." : "Mr.") + getShortName(n.ten);

            const row = document.createElement('tr');
            row.innerHTML = `
                <td><b>${displayName}</b></td>
                <td><input type="text" class="tu-ngay" value="${n.tuNgay}" placeholder="dd/mm/yyyy" onchange="capNhatNgay(${i}, 'tuNgay', this.value)"></td>
                <td><input type="text" class="den-ngay" value="${n.denNgay}" placeholder="dd/mm/yyyy" onchange="capNhatNgay(${i}, 'denNgay', this.value)"></td>
                <td><b>${soNgay}</b></td>
                <td style="color:#d63384; font-weight:bold;">
                    ${ctpDisplay.toLocaleString('vi-VN')}
                    ${dsTrung.length > 0 ? '<br><span class="trung-badge">TRÙNG</span>' : ''}
                </td>
                <td><input type="text" class="ghi-chu" value="${(n.ghiChu || '').replace(/"/g,'&quot;')}" placeholder="${autoGhiChu || 'Ghi chú...'}" onchange="capNhatGhiChu(${i}, this.value)"></td>
            `;
            tbody.appendChild(row);
        });

        document.getElementById('tongCTP').innerText = tongCTP.toLocaleString('vi-VN') + " đ";
        renderWarning();
    }

    function renderWarning() {
        const dsCanhBao = [];
        dsDangChon.forEach(n => {
            const ngayList = lietKeNgay(n.tuNgay, n.denNgay);
            const dsTrung = kiemTraTrungNgay(n.ten, ngayList);
            if (dsTrung.length > 0) {
                dsCanhBao.push({
                    ten: n.ten,
                    dsCT: dsTrung.map(x => `${x.ctId} (${x.soNgayTrung} ngày)`)
                });
            }
        });

        const box = document.getElementById('warningBox');
        if (dsCanhBao.length === 0) { box.innerHTML = ''; return; }

        box.innerHTML = `<div class="warning-box">
            <b>⚠️ Cảnh báo trùng ngày công tác (${dsCanhBao.length} người):</b>
            <ul>
                ${dsCanhBao.map(c => `<li><b>${c.ten}</b>: Đã tính CTP ở ${c.dsCT.join(', ')} → CT này tính 0đ</li>`).join('')}
            </ul>
        </div>`;
    }

    function capNhatNgay(idx, field, val) {
        dsDangChon[idx][field] = val;
        renderBang();
    }
    function capNhatGhiChu(idx, val) {
        dsDangChon[idx].ghiChu = val;
    }

    // ============ LƯU ============
    function luuForm() {
        dbCongTac[CT_ID].danhsach = {
            soGiay: document.getElementById('soGiay').value,
            ngayGiay: document.getElementById('ngayGiay').value,
            danhSach: dsDangChon
        };
        localStorage.setItem('db_congtac', JSON.stringify(dbCongTac));
        alert("✅ Đã lưu Danh sách!");
    }

    // ============ XUẤT WORD ============
    async function xuatWord() {
        luuForm();
        document.getElementById("loading").style.display = "flex";

        if (dsDangChon.length === 0) {
            alert("Chưa có người nào!");
            document.getElementById("loading").style.display = "none";
            return;
        }

        const ngayGiayStr = document.getElementById('ngayGiay').value || '';
        let ngayObj = { ngay: "", thang: "", nam: "" };
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(ngayGiayStr)) {
            const [d, m, y] = ngayGiayStr.split('/');
            ngayObj = { ngay: d, thang: m, nam: y };
        }

        const danhSach = dsDangChon.map((n, idx) => {
            const soNgay = tinhSoNgay(n.tuNgay, n.denNgay);
            let ctp = tinhCTP(soNgay);
            const ngayList = lietKeNgay(n.tuNgay, n.denNgay);
            const dsTrung = kiemTraTrungNgay(n.ten, ngayList);
            let autoGhiChu = n.ghiChu || "";
            if (dsTrung.length > 0) {
                if (!autoGhiChu) autoGhiChu = `Đã tính ở ${dsTrung.map(x => x.ctId).join(', ')}`;
                ctp = 0;
            }
            return {
                stt: ('0' + (idx + 1)).slice(-2),
                ho_ten: n.ten,
                chuc_vu: CHUC_VU_MAC_DINH[n.ten] || "Nhân viên",
                tu_ngay: n.tuNgay,
                den_ngay: n.denNgay,
                so_ngay: soNgay,
                tien_ctp: ctp.toLocaleString('vi-VN'),
                ghi_chu: autoGhiChu,
                ky_xac_nhan: ""
            };
        });

        const data = {
            so_giay: document.getElementById('soGiay').value,
            ngay_giay: ngayObj.ngay,
            thang_giay: ngayObj.thang,
            nam_giay: ngayObj.nam,
            danh_sach: danhSach
        };

        try {
            const res = await fetch(`${GOOGLE_WEB_APP_URL}?action=getTemplate&fileId=${ID_TEMPLATE_DANHSACH}`);
            const result = await res.json();
            const binary = window.atob(result.base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

            const zip = new PizZip(bytes.buffer);
            const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true, nullGetter: () => "" });
            doc.render(data);

            const blob = doc.getZip().generate({
                type: "blob",
                mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            });
            saveAs(blob, `Danh_sach_${CT_ID}.docx`);
            document.getElementById("loading").style.display = "none";
        } catch (e) {
            console.error(e);
            alert("Lỗi: " + e.message);
            document.getElementById("loading").style.display = "none";
        }
    }
</script>
</body>
</html>
