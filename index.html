<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHẦN MỀM XUẤT BIÊN BẢN PATC & HIỆN TRƯỜNG</title>
    <!-- Thư viện hỗ trợ xuất Word -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
    <!-- Font chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0056b3;
            --primary-hover: #004494;
            --success: #28a745;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --border: #dee2e6;
            --radius: 12px;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; color: var(--text-main); }
        .container { max-width: 900px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { color: var(--primary); margin: 0; font-size: 22px; font-weight: 700; text-transform: uppercase; }
        .header p { color: #6c757d; margin-top: 5px; font-size: 14px; }

        .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; border-top: 4px solid var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 10px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #495057; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; box-sizing: border-box; background-color: #fafbfc; transition: all 0.2s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); background-color: #fff; box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1); }
        textarea { resize: vertical; height: 90px; }

        /* Tối ưu hóa cho iPad (Chips UI thay cho ô Checkbox vuông nhỏ) */
        .chip-group { display: flex; flex-wrap: wrap; gap: 8px; padding: 5px 0; }
        .chip-item input[type="checkbox"] { display: none; }
        .chip-item label { 
            display: inline-block; background-color: #e9ecef; color: #495057; 
            padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; 
            cursor: pointer; user-select: none; border: 1px solid transparent; transition: 0.2s;
        }
        .chip-item input[type="checkbox"]:checked + label { background-color: #e6f2ff; color: var(--primary); border-color: var(--primary); font-weight: 600; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .dual-group-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .group-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px dashed var(--border); }
        
        .stats-box { background: #e6f2ff; color: var(--primary); padding: 10px 15px; border-radius: 8px; font-weight: 600; font-size: 14px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

        button.btn-submit { background-color: var(--success); color: white; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; width: 100%; text-transform: uppercase; box-shadow: 0 4px 6px rgba(40, 167, 69, 0.2); }
        button.btn-submit:hover { background-color: #218838; }

        /* CSS Màn hình chờ (Loading) */
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); z-index: 9999;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loadingText { margin-top: 15px; font-weight: 600; color: var(--primary); font-size: 14px; }

        @media (max-width: 768px) { .dual-group-container, .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<!-- Màn hình Loading -->
<div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText">Đang kết nối Google Drive và xuất file...</div>
</div>

<div class="container">
    <div class="header">
        <h2>HỆ THỐNG XUẤT BIÊN BẢN</h2>
        <p>Phổ biến Phương Án Thi Công (PATC) & Hiện Trường</p>
    </div>

    <!-- Cấu hình Nhân sự -->
    <div class="card">
        <div class="card-title">👨‍🔧 Cơ cấu tổ chức Nhóm công tác</div>
        <div class="form-group">
            <select id="soLuongNhom" onchange="toggleGroupMode()">
                <option value="1">01 Nhóm công tác chung</option>
                <option value="2">02 Nhóm công tác (Tách nhóm)</option>
            </select>
        </div>
        <div class="stats-box" id="statsBox">
            <span>Tổng nhân sự: 0 người</span>
            <span style="font-size: 12px; font-weight: normal;">(0 Chỉ huy - 0 Nhân viên)</span>
        </div>

        <!-- 1 NHÓM -->
        <div id="singleGroupSection">
            <div class="form-group">
                <label>Chỉ huy trực tiếp:</label>
                <select id="chiHuyChung" onchange="updateMemberCount()">
                    <option value="" disabled selected>-- Chọn người chỉ huy --</option>
                    <option value="Trần Văn Hoàng">A.Hoàng</option>
                    <option value="Nguyễn Hữu Kính">A.Kính</option>
                    <option value="Kim Văn Quỳnh">A.Quỳnh</option>
                    <option value="Hồ Văn Huy">A.Huy</option>
                    <option value="Hoàng Trần Quản Trọng">A.Trọng</option>
                </select>
            </div>
            <div class="form-group">
                <label>Thành viên tham gia:</label>
                <div class="chip-group" id="nvChungContainer"></div>
            </div>
        </div>

        <!-- 2 NHÓM -->
        <div id="dualGroupSection" style="display: none;">
            <div class="dual-group-container">
                <div class="group-box">
                    <label style="color: var(--primary); font-weight: bold; margin-bottom: 10px;">Nhóm 1</label>
                    <div class="form-group">
                        <select id="chiHuy1" onchange="updateMemberCount()">
                            <option value="" disabled selected>-- Chọn chỉ huy 1 --</option>
                            <option value="Trần Văn Hoàng">A.Hoàng</option>
                            <option value="Nguyễn Hữu Kính">A.Kính</option>
                            <option value="Kim Văn Quỳnh">A.Quỳnh</option>
                        </select>
                    </div>
                    <div class="chip-group" id="nvNhom1Container"></div>
                </div>
                
                <div class="group-box">
                    <label style="color: var(--primary); font-weight: bold; margin-bottom: 10px;">Nhóm 2</label>
                    <div class="form-group">
                        <select id="chiHuy2" onchange="updateMemberCount()">
                            <option value="" disabled selected>-- Chọn chỉ huy 2 --</option>
                            <option value="Hồ Văn Huy">A.Huy</option>
                            <option value="Hoàng Trần Quản Trọng">A.Trọng</option>
                        </select>
                    </div>
                    <div class="chip-group" id="nvNhom2Container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Nội dung & Thời gian -->
    <div class="card">
        <div class="card-title">📝 Chi tiết Công việc & Thời gian</div>
        <div class="grid-2">
            <div class="form-group">
                <label>Số GĐKCT</label>
                <input type="number" id="stt" placeholder="Nhập số GĐKCT..." required>
            </div>
            <div class="form-group">
                <label>Phạm vi làm việc (Địa điểm)</label>
                <input type="text" id="diaDiem" placeholder="VD: Ngăn lộ 271..." required>
            </div>
        </div>
        <div class="form-group">
            <label>Nội dung công việc</label>
            <textarea id="noiDung" placeholder="Mô tả chi tiết nội dung công tác..." required></textarea>
        </div>
        <div class="grid-2">
            <div class="form-group" id="sectionBB1">
                <label>Thời gian phổ biến PATC</label>
                <input type="datetime-local" id="startBB1">
                <input type="hidden" id="endBB1">
            </div>
            <div class="form-group" id="sectionBB2">
                <label>Thời gian phổ biến Hiện trường</label>
                <input type="datetime-local" id="startBB2">
                <input type="hidden" id="endBB2">
            </div>
        </div>
    </div>

    <!-- Xuất File -->
    <div class="card">
        <div class="form-group">
            <label>Tùy chọn xuất file</label>
            <select id="loaiBienBan" onchange="toggleBienBanSections()">
                <option value="both">Xuất đồng thời CẢ 2 BIÊN BẢN</option>
                <option value="bb1">Chỉ xuất BB Phổ biến PATC</option>
                <option value="bb2">Chỉ xuất BB Hiện trường</option>
            </select>
        </div>
        <button type="button" class="btn-submit" onclick="xuatFileWord()">Tiến hành Xuất Biên Bản</button>
    </div>
</div>

<script>
    // =========================================================
    // 🔴 1. CẤU HÌNH API VÀ ID GOOGLE DRIVE TẠI ĐÂY
    // =========================================================
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlM-814su7_q0yS7Qx1bdwC1j9CB18Km6UOdMcJW4ifZUecl633RmEhvxnsUIwerlE/exec";
    
    // ĐIỀN ID CỦA 2 FILE MẪU VÀO ĐÂY (Giống cách làm bên Máy Cắt)
    const ID_TEMPLATE_BB1 = "1Gj1PDFAHWeKG_2PCod4dLKHvXxq5xf6u"; 
    const ID_TEMPLATE_BB2 = "1AN9tE1UvR1KV3YNcs5P9RFxmcnsxwkBd";
    // =========================================================

    const danhSachNhanVien = [
        { id: "nv1", val: "Hoàng Trần Quản Trọng", label: "A.Trọng" },
        { id: "nv2", val: "Trần Văn Hoàng", label: "A.Hoàng" },
        { id: "nv3", val: "Kim Văn Quỳnh", label: "A.Quỳnh" },
        { id: "nv4", val: "Hồ Văn Huy", label: "A.Huy" },
        { id: "nv5", val: "Lê Hữu Anh", label: "A.Anh" },
        { id: "nv6", val: "Trần Phúc Linh", label: "A.Linh" },
        { id: "nv7", val: "Tạ Quốc Đạt", label: "A.Đạt" },
        { id: "nv8", val: "Ngô Văn Quang", label: "A.Quang" },
        { id: "nv9", val: "Võ Ngọc Sơn", label: "A.Sơn" },
        { id: "nv10", val: "Nguyễn Xuân Khánh", label: "A.Khánh" },
        { id: "nv11", val: "Đoàn Hoàng Quang Định", label: "A.Định" },
        { id: "nv12", val: "Võ Văn Sỹ", label: "A.Sỹ" },
        { id: "nv13", val: "Lưu Đức Minh", label: "A.Minh" },
        { id: "nv14", val: "Nguyễn Hữu Kính", label: "A.Kính" }
    ];

    // Tạo HTML cho các thẻ tên nhân viên
    function renderChips(containerId, nameAttr) {
        let html = '';
        danhSachNhanVien.forEach(nv => {
            let uniqueId = nameAttr + '_' + nv.id;
            html += `<div class="chip-item"><input type="checkbox" id="${uniqueId}" name="${nameAttr}" value="${nv.val}" onchange="updateMemberCount()"><label for="${uniqueId}">${nv.label}</label></div>`;
        });
        document.getElementById(containerId).innerHTML = html;
    }

    window.onload = function() {
        renderChips('nvChungContainer', 'nhanVienChung');
        renderChips('nvNhom1Container', 'nhanVien1');
        renderChips('nvNhom2Container', 'nhanVien2');
        updateMemberCount();
    }

    function toggleGroupMode() {
        const mode = document.getElementById('soLuongNhom').value;
        document.getElementById('singleGroupSection').style.display = (mode === '1') ? 'block' : 'none';
        document.getElementById('dualGroupSection').style.display = (mode === '2') ? 'block' : 'none';
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        updateMemberCount();
    }

    function updateMemberCount() {
        const mode = document.getElementById('soLuongNhom').value;
        let cH = 0, cNV = 0;
        if (mode === '1') {
            cH = document.getElementById('chiHuyChung').value ? 1 : 0;
            cNV = document.querySelectorAll('input[name="nhanVienChung"]:checked').length;
        } else {
            cH = (document.getElementById('chiHuy1').value ? 1 : 0) + (document.getElementById('chiHuy2').value ? 1 : 0);
            cNV = document.querySelectorAll('input[name="nhanVien1"]:checked').length + document.querySelectorAll('input[name="nhanVien2"]:checked').length;
        }
        document.getElementById('statsBox').innerHTML = `<span>Tổng nhân sự: ${cH + cNV} người</span><span style="font-size: 12px; font-weight: normal;">(${cH} Chỉ huy - ${cNV} Nhân viên)</span>`;
    }

    function toggleBienBanSections() {
        const choice = document.getElementById('loaiBienBan').value;
        document.getElementById('sectionBB1').style.opacity = (choice === 'both' || choice === 'bb1') ? '1' : '0.4';
        document.getElementById('sectionBB2').style.opacity = (choice === 'both' || choice === 'bb2') ? '1' : '0.4';
    }

    function setupAutoTime(startId, endId, minutesToAdd) {
        document.getElementById(startId).addEventListener('change', function() {
            if (this.value) {
                let d = new Date(this.value);
                d.setMinutes(d.getMinutes() + minutesToAdd);
                let yyyy = d.getFullYear(), mm = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0'), hh = String(d.getHours()).padStart(2, '0'), min = String(d.getMinutes()).padStart(2, '0');
                document.getElementById(endId).value = `${yyyy}-${mm}-${dd}T${hh}:${min}`;
            }
        });
    }
    setupAutoTime('startBB1', 'endBB1', 30);
    setupAutoTime('startBB2', 'endBB2', 10);

    // =========================================================
    // 🔴 2. HÀM GỌI API ĐỂ LẤY FILE WORD TỪ DRIVE 
    // (Cơ chế giống y hệt phần Máy Cắt của anh bạn anh)
    // =========================================================
    async function fetchAndExportDocx(fileId, dataPayload, outputFilename) {
        try {
            const res = await fetch(`${GOOGLE_WEB_APP_URL}?action=getTemplate&fileId=${fileId}`);
            const result = await res.json();
            
            if (result.error) throw new Error(result.error);

            // Xử lý chuỗi Base64
            const binaryString = window.atob(result.base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            // Kết hợp dữ liệu bằng docxtemplater
            const zip = new PizZip(bytes.buffer);
            const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
            doc.render(dataPayload);

            // Xuất file
            const out = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
            saveAs(out, outputFilename);

        } catch (error) {
            console.error(error);
            alert("❌ Lỗi khi xuất file " + outputFilename + ": " + error.message);
        }
    }

    // =========================================================
    // HÀM CHÍNH ĐỂ XỬ LÝ KHI BẤM NÚT XUẤT
    // =========================================================
    async function xuatFileWord() {
        const choice = document.getElementById('loaiBienBan').value;
        const noiDung = document.getElementById('noiDung').value;
        const diaDiem = document.getElementById('diaDiem').value;
        const stt = document.getElementById('stt').value;
        const mode = document.getElementById('soLuongNhom').value;

        if (!noiDung || !diaDiem || !stt) { alert('Vui lòng điền đủ Số GĐKCT, Địa điểm và Nội dung!'); return; }
        if (ID_TEMPLATE_BB1.includes("ID_FILE_") || ID_TEMPLATE_BB2.includes("ID_FILE_")) {
            alert('⚠️ Anh quên chưa dán ID của 2 file Word vào code HTML kìa!'); return; 
        }

        let chiHuyChinh = "";
        let danhSachThanhVien = [];
        let i = 1;

        if (mode === '1') {
            chiHuyChinh = document.getElementById('chiHuyChung').value;
            if (!chiHuyChinh) { alert('Vui lòng chọn Chỉ huy!'); return; }
            document.querySelectorAll('input[name="nhanVienChung"]:checked').forEach(cb => {
                danhSachThanhVien.push({ stt: i++, ho_ten: cb.value, nhiem_vu: noiDung });
            });
        } else {
            let ch1 = document.getElementById('chiHuy1').value;
            let ch2 = document.getElementById('chiHuy2').value;
            chiHuyChinh = ch1 || ch2;
            if (!ch1 && !ch2) { alert('Vui lòng chọn ít nhất một Chỉ huy nhóm!'); return; }
            document.querySelectorAll('input[name="nhanVien1"]:checked').forEach(cb => danhSachThanhVien.push({ stt: i++, ho_ten: cb.value, nhiem_vu: noiDung }));
            document.querySelectorAll('input[name="nhanVien2"]:checked').forEach(cb => danhSachThanhVien.push({ stt: i++, ho_ten: cb.value, nhiem_vu: noiDung }));
        }

        let tongSoThanhVien = 1 + danhSachThanhVien.length;
        
        // Dữ liệu chung cho cả 2 file
        const baseData = {
            nguoi_chu_tri: chiHuyChinh,
            tong_so_tham_gia: `${tongSoThanhVien}/${tongSoThanhVien}`,
            tong_so_vang: "Vắng 00",
            noi_dung_cong_tac: noiDung,
            dia_diem_cong_tac: diaDiem,
            danh_sach_nhan_vien: danhSachThanhVien
        };

        // Bật Loading
        document.getElementById('loadingOverlay').style.display = 'flex';

        try {
            // Xử lý BB1 (PATC)
            if (choice === 'both' || choice === 'bb1') {
                let start = document.getElementById('startBB1').value;
                if (!start) { alert('Vui lòng nhập Thời gian PATC!'); document.getElementById('loadingOverlay').style.display = 'none'; return; }
                
                let dataBB1 = { 
                    ...baseData, 
                    thoi_gian_bat_dau1: formatDateTime(start), 
                    thoi_gian_ket_thuc1: formatTimeOnly(document.getElementById('endBB1').value), 
                    ngay_pho_bien: formatDateOnly(start) 
                };
                
                // Gọi hàm Fetch
                await fetchAndExportDocx(ID_TEMPLATE_BB1, dataBB1, `BB_PATC_GDKCT_${stt}.docx`);
            }

            // Xử lý BB2 (Hiện trường)
            if (choice === 'both' || choice === 'bb2') {
                let start = document.getElementById('startBB2').value;
                if (!start) { alert('Vui lòng nhập Thời gian Hiện trường!'); document.getElementById('loadingOverlay').style.display = 'none'; return; }
                
                let dataBB2 = { 
                    ...baseData, 
                    thoi_gian_bat_dau2: formatDateTime(start), 
                    thoi_gian_ket_thuc2: formatTimeOnly(document.getElementById('endBB2').value) 
                };
                
                // Gọi hàm Fetch (Nếu xuất cả 2 thì hàm này sẽ chạy tuần tự ngay sau khi hàm trên tải xong)
                await fetchAndExportDocx(ID_TEMPLATE_BB2, dataBB2, `BB_HienTruong_GDKCT_${stt}.docx`);
            }
        } catch (err) {
            console.error(err);
        } finally {
            // Tắt Loading
            document.getElementById('loadingOverlay').style.display = 'none';
        }
    }

    // Các hàm định dạng thời gian
    function formatDateTime(dtStr) {
        let d = new Date(dtStr);
        return `${String(d.getHours()).padStart(2,'0')} giờ ${String(d.getMinutes()).padStart(2,'0')} ngày ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }
    function formatTimeOnly(dtStr) {
        let d = new Date(dtStr);
        return `${String(d.getHours()).padStart(2,'0')} giờ ${String(d.getMinutes()).padStart(2,'0')}`;
    }
    function formatDateOnly(dtStr) {
        let d = new Date(dtStr);
        return `ngày ${String(d.getDate()).padStart(2,'0')} tháng ${String(d.getMonth()+1).padStart(2,'0')} năm ${d.getFullYear()}`;
    }
</script>

</body>
</html>
