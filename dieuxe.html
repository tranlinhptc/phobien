<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lệnh Điều Xe - TNĐLĐ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 10px; }
        .container { width: 100%; max-width: 620px; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin: auto; box-sizing: border-box; }
        h2 { text-align: center; color: #c00; margin-top: 0; text-transform: uppercase; font-size: 20px; }
        h3 { color: #0056b3; border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-top: 20px; font-size: 15px; }
        .form-group { margin-bottom: 12px; }
        label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 4px; color: #c00; }
        input, select, textarea { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        button { background: #28a745; color: #fff; border: none; padding: 11px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 8px; border-radius: 6px; font-size: 14px; }
        .btn-blue { background: #007bff; } .btn-orange { background: #fd7e14; } .btn-red { background: #dc3545; }
        .btn-gray { background: #6c757d; } .btn-purple { background: #6f42c1; }
        .btn-sm { padding: 5px 10px; font-size: 12px; width: auto; margin: 2px; }

        .xe-card { border: 2px solid #007bff; border-radius: 10px; padding: 12px; margin-bottom: 14px; background: #f9fbff; }
        .xe-card .xe-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px dashed #007bff; }
        .xe-card .xe-title { font-weight: bold; color: #0056b3; font-size: 14px; }
        .xe-card .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
        .xe-card .row label { flex: 0 0 100px; color: #333; font-size: 12px; margin: 0; font-weight: bold; }
        .xe-card .row input, .xe-card .row select { flex: 1; padding: 7px; font-size: 13px; }
        .xe-card .bien-so-text { flex: 1; font-size: 13px; color: #555; font-style: italic; background: #fff; padding: 7px; border-radius: 4px; border: 1px dashed #ccc; }

        .list-input { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; }
        .list-input input, .list-input select { flex: 1; }
        .list-input button { width: auto; margin: 0; padding: 6px 10px; font-size: 12px; }

        .info-text { font-size: 12px; color: #666; font-style: italic; }
        #loading { display: none; position: fixed; inset: 0; z-index: 99999; background: rgba(255,255,255,.9); align-items: center; justify-content: center; color: #007bff; font-weight: bold; font-size: 18px; }
        .note { font-size: 11px; color: #666; font-style: italic; margin: 4px 0; }
        .header-actions { display: flex; gap: 6px; margin-bottom: 10px; }
        .header-actions button { margin: 0; padding: 8px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <button class="btn-blue" onclick="luuForm()">💾 Lưu form</button>
        <button class="btn-gray" onclick="taiForm()">📂 Tải form</button>
        <button class="btn-red" onclick="xoaForm()">🗑️ Xóa form</button>
    </div>

    <h2>LỆNH ĐIỀU XE</h2>

    <p class="note">Mỗi xe là 1 lệnh điều xe riêng. Bấm "Xuất tất cả" để tạo nhiều file Word.</p>

    <div id="dsXeContainer"></div>

    <button class="btn-purple" onclick="addXe()">+ Thêm xe</button>
    <button class="btn-orange" onclick="xuatTatCa()">📄 Xuất tất cả Lệnh điều xe Word</button>
</div>

<div id="loading">⏳ Đang xử lý, chờ xíu...</div>

<script>
    // ============ CẤU HÌNH ============
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlM-814su7_q0yS7Qx1bdwC1j9CB18Km6UOdMcJW4ifZUecl633RmEhvxnsUIwerlE/exec";
    const ID_TEMPLATE_DIEUXE = "1GeIU57-WNr9XOgF5w8UInBMMZKdupfzv"; // Thay ID file Word mẫu Lệnh điều xe

    const DEFAULT_XE = [
        { ten: "Ford Transit",   bienSo: "79B 332.11",  dinhMuc: 20 },
        { ten: "Ford Ranger",    bienSo: "79C 038.20",  dinhMuc: 15 },
        { ten: "Ford Fortuner",  bienSo: "79A 866.70",  dinhMuc: 19 }
    ];

    // Người sử dụng xe cố định
    const NGUOI_SU_DUNG = "Tổ thí nghiệm điện Lâm Đồng";

    // ============ STATE ============
    let dsXeGoc = [];
    let dsLaiXe = [];        // lấy từ Đề cương (vai trò LX)
    let dsNoiDungGoiY = []; // LocalStorage gợi ý
    let dsDiaDiemGoiY = []; // LocalStorage gợi ý

    // ============ KHỞI TẠO ============
    window.onload = function() {
        dsXeGoc = JSON.parse(localStorage.getItem('ds_xe_goc')) || DEFAULT_XE.slice();

        // Lấy danh sách lái xe từ form Đề cương đã lưu
        const decuong = JSON.parse(localStorage.getItem('decuong_form_data') || '{}');
        if (decuong.selectedRoles) {
            dsLaiXe = Object.keys(decuong.selectedRoles).filter(n => decuong.selectedRoles[n] === 'LX');
        }
        // Nếu không có, dùng 2 lái xe mặc định
        if (dsLaiXe.length === 0) {
            dsLaiXe = ["Nguyễn Mạnh Hiệp", "Mai Văn Giáp"];
        }

        // Lấy gợi ý đã lưu
        dsNoiDungGoiY = JSON.parse(localStorage.getItem('goiy_noi_dung') || '[]');
        dsDiaDiemGoiY = JSON.parse(localStorage.getItem('goiy_dia_diem') || '[]');

        // Thêm 1 xe mặc định
        addXe();
    };

    // ============ QUẢN LÝ XE ============
    function addXe() {
        const container = document.getElementById('dsXeContainer');
        const idx = container.children.length + 1;
        const card = document.createElement('div');
        card.className = 'xe-card';
        card.innerHTML = `
            <div class="xe-header">
                <span class="xe-title">🚗 Xe ${idx}</span>
                <button class="btn-red btn-sm" onclick="this.closest('.xe-card').remove(); capNhatSoXe();">Xóa</button>
            </div>
            <div class="row">
                <label>Chọn xe:</label>
                <select class="chon-xe" onchange="capNhatXe(this)">
                    <option value="">-- Chọn --</option>
                    ${dsXeGoc.map((x, i) => `<option value="${i}">${x.ten}</option>`).join('')}
                </select>
            </div>
            <div class="row"><label>Biển số:</label><span class="bien-so-text">--</span></div>
            <div class="row">
                <label>Lái xe:</label>
                <input type="text" class="lai-xe" list="dsLaiXeList" placeholder="Gõ hoặc chọn...">
            </div>
            <div class="row">
                <label>Người sử dụng:</label>
                <input type="text" class="nguoi-su-dung" value="${NGUOI_SU_DUNG}">
            </div>

            <div style="margin-top:10px; padding-top:10px; border-top:1px dashed #ccc;">
                <label style="color:#c00;">Mục đích công tác:</label>
                <div class="ds-noi-dung"></div>
                <button class="btn-blue btn-sm" onclick="addNoiDung(this)">+ Thêm nội dung</button>
            </div>

            <div style="margin-top:10px; padding-top:10px; border-top:1px dashed #ccc;">
                <label style="color:#c00;">Địa điểm công tác:</label>
                <div class="ds-dia-diem"></div>
                <button class="btn-blue btn-sm" onclick="addDiaDiem(this)">+ Thêm địa điểm</button>
            </div>

            <div style="margin-top:10px; padding-top:10px; border-top:1px dashed #ccc;">
                <div class="row">
                    <label>Từ ngày:</label>
                    <input type="date" class="tu-ngay">
                </div>
                <div class="row">
                    <label>Đến ngày:</label>
                    <input type="date" class="den-ngay">
                </div>
            </div>
        `;
        container.appendChild(card);

        // Thêm 1 dòng nội dung và địa điểm mặc định
        addNoiDung(card.querySelector('.btn-blue'));
        addDiaDiem(card.querySelectorAll('.btn-blue')[1]);

        capNhatSoXe();
    }

    function capNhatSoXe() {
        const cards = document.querySelectorAll('.xe-card');
        cards.forEach((card, i) => {
            card.querySelector('.xe-title').innerText = `🚗 Xe ${i + 1}`;
        });
    }

    function capNhatXe(select) {
        const idx = select.value;
        const card = select.closest('.xe-card');
        if (idx === "") {
            card.querySelector('.bien-so-text').innerText = "--";
        } else {
            const xe = dsXeGoc[idx];
            card.querySelector('.bien-so-text').innerText = xe.bienSo;
        }
    }

    // ============ DANH SÁCH ĐỘNG (Nội dung / Địa điểm) ============
    function addNoiDung(btn) {
        const card = btn.closest('.xe-card');
        const container = card.querySelector('.ds-noi-dung');
        const div = document.createElement('div');
        div.className = 'list-input';
        div.innerHTML = `
            <input type="text" class="noi-dung" list="dsNoiDungList" placeholder="Nhập nội dung...">
            <button class="btn-red btn-sm" onclick="this.parentElement.remove()">X</button>
        `;
        container.appendChild(div);
    }

    function addDiaDiem(btn) {
        const card = btn.closest('.xe-card');
        const container = card.querySelector('.ds-dia-diem');
        const div = document.createElement('div');
        div.className = 'list-input';
        div.innerHTML = `
            <input type="text" class="dia-diem" list="dsDiaDiemList" placeholder="Nhập địa điểm...">
            <button class="btn-red btn-sm" onclick="this.parentElement.remove()">X</button>
        `;
        container.appendChild(div);
    }

    // ============ DATALIST GỢI Ý ============
    function renderDatalists() {
        // Datalist cho lái xe
        let dl = document.getElementById('dsLaiXeList');
        if (!dl) {
            dl = document.createElement('datalist');
            dl.id = 'dsLaiXeList';
            document.body.appendChild(dl);
        }
        dl.innerHTML = dsLaiXe.map(n => `<option value="${n}">`).join('');

        // Datalist cho nội dung
        let dl2 = document.getElementById('dsNoiDungList');
        if (!dl2) {
            dl2 = document.createElement('datalist');
            dl2.id = 'dsNoiDungList';
            document.body.appendChild(dl2);
        }
        dl2.innerHTML = dsNoiDungGoiY.map(n => `<option value="${n.replace(/"/g,'&quot;')}">`).join('');

        // Datalist cho địa điểm
        let dl3 = document.getElementById('dsDiaDiemList');
        if (!dl3) {
            dl3 = document.createElement('datalist');
            dl3.id = 'dsDiaDiemList';
            document.body.appendChild(dl3);
        }
        dl3.innerHTML = dsDiaDiemGoiY.map(n => `<option value="${n.replace(/"/g,'&quot;')}">`).join('');
    }
    renderDatalists();

    // ============ ĐỊNH DẠNG NGÀY ============
    function formatDate(str) {
        if (!str) return "";
        const d = new Date(str);
        return `${('0'+d.getDate()).slice(-2)}/${('0'+(d.getMonth()+1)).slice(-2)}/${d.getFullYear()}`;
    }

    // ============ LƯU / TẢI FORM ============
    function luuForm() {
        const xeList = [];
        document.querySelectorAll('.xe-card').forEach(card => {
            const noiDung = [...card.querySelectorAll('.noi-dung')].map(i => i.value).filter(v => v.trim());
            const diaDiem = [...card.querySelectorAll('.dia-diem')].map(i => i.value).filter(v => v.trim());
            xeList.push({
                xeIdx: card.querySelector('.chon-xe').value,
                bienSo: card.querySelector('.bien-so-text').innerText,
                laiXe: card.querySelector('.lai-xe').value,
                nguoiSuDung: card.querySelector('.nguoi-su-dung').value,
                noiDung: noiDung,
                diaDiem: diaDiem,
                tuNgay: card.querySelector('.tu-ngay').value,
                denNgay: card.querySelector('.den-ngay').value
            });
        });

        localStorage.setItem('dieuxe_form_data', JSON.stringify({ xeList }));
        alert("✅ Đã lưu form Lệnh điều xe!");
    }

    function taiForm() {
        const saved = localStorage.getItem('dieuxe_form_data');
        if (!saved) { alert("Chưa có dữ liệu form được lưu."); return; }
        const d = JSON.parse(saved);

        const container = document.getElementById('dsXeContainer');
        container.innerHTML = '';

        (d.xeList || []).forEach(x => {
            addXe();
            const card = container.lastElementChild;
            if (x.xeIdx !== '') {
                card.querySelector('.chon-xe').value = x.xeIdx;
                card.querySelector('.bien-so-text').innerText = x.bienSo;
            }
            card.querySelector('.lai-xe').value = x.laiXe || '';
            card.querySelector('.nguoi-su-dung').value = x.nguoiSuDung || NGUOI_SU_DUNG;

            // Xóa dòng mặc định, thêm lại theo dữ liệu đã lưu
            card.querySelector('.ds-noi-dung').innerHTML = '';
            (x.noiDung || []).forEach(nd => {
                const div = document.createElement('div');
                div.className = 'list-input';
                div.innerHTML = `<input type="text" class="noi-dung" list="dsNoiDungList" value="${nd.replace(/"/g,'&quot;')}"><button class="btn-red btn-sm" onclick="this.parentElement.remove()">X</button>`;
                card.querySelector('.ds-noi-dung').appendChild(div);
            });
            if ((x.noiDung || []).length === 0) addNoiDung(card.querySelectorAll('.btn-blue')[0]);

            card.querySelector('.ds-dia-diem').innerHTML = '';
            (x.diaDiem || []).forEach(dd => {
                const div = document.createElement('div');
                div.className = 'list-input';
                div.innerHTML = `<input type="text" class="dia-diem" list="dsDiaDiemList" value="${dd.replace(/"/g,'&quot;')}"><button class="btn-red btn-sm" onclick="this.parentElement.remove()">X</button>`;
                card.querySelector('.ds-dia-diem').appendChild(div);
            });
            if ((x.diaDiem || []).length === 0) addDiaDiem(card.querySelectorAll('.btn-blue')[1]);

            card.querySelector('.tu-ngay').value = x.tuNgay || '';
            card.querySelector('.den-ngay').value = x.denNgay || '';
        });

        capNhatSoXe();
        alert("✅ Đã tải form Lệnh điều xe!");
    }

    function xoaForm() {
        if (confirm("Xóa toàn bộ form Lệnh điều xe đã lưu?")) {
            localStorage.removeItem('dieuxe_form_data');
            alert("Đã xóa.");
        }
    }

    // ============ LƯU GỢI Ý TỰ ĐỘNG ============
    function luuGoiY(noiDungMoi, diaDiemMoi) {
        // Gộp và loại trùng
        const setND = new Set([...dsNoiDungGoiY, ...noiDungMoi.filter(v => v.trim())]);
        const setDD = new Set([...dsDiaDiemGoiY, ...diaDiemMoi.filter(v => v.trim())]);
        dsNoiDungGoiY = [...setND].slice(-50); // giữ tối đa 50
        dsDiaDiemGoiY = [...setDD].slice(-50);
        localStorage.setItem('goiy_noi_dung', JSON.stringify(dsNoiDungGoiY));
        localStorage.setItem('goiy_dia_diem', JSON.stringify(dsDiaDiemGoiY));
        renderDatalists();
    }

    // ============ XUẤT WORD ============
    async function xuatTatCa() {
        const cards = document.querySelectorAll('.xe-card');
        if (cards.length === 0) { alert("Chưa có xe nào!"); return; }

        document.getElementById("loading").style.display = "flex";

        const allNoiDung = [];
        const allDiaDiem = [];
        const danhSachXeData = [];

        cards.forEach(card => {
            const bienSo = card.querySelector('.bien-so-text').innerText;
            if (!bienSo || bienSo === '--') return;

            const noiDung = [...card.querySelectorAll('.noi-dung')].map(i => i.value.trim()).filter(v => v);
            const diaDiem = [...card.querySelectorAll('.dia-diem')].map(i => i.value.trim()).filter(v => v);
            allNoiDung.push(...noiDung);
            allDiaDiem.push(...diaDiem);

            danhSachXeData.push({
                ten_xe: card.querySelector('.chon-xe').selectedOptions[0]?.text || "",
                bien_so: bienSo,
                lai_xe: card.querySelector('.lai-xe').value,
                nguoi_su_dung: card.querySelector('.nguoi-su-dung').value,
                danh_sach_noi_dung: noiDung.map(nd => ({ noi_dung: nd })),
                dia_diem_text: diaDiem.join(' + '),
                tu_ngay: formatDate(card.querySelector('.tu-ngay').value),
                den_ngay: formatDate(card.querySelector('.den-ngay').value)
            });
        });

        if (danhSachXeData.length === 0) {
            alert("Chưa chọn xe nào!");
            document.getElementById("loading").style.display = "none";
            return;
        }

        // Lưu gợi ý
        luuGoiY(allNoiDung, allDiaDiem);

        // Lấy file mẫu 1 lần
        try {
            const res = await fetch(`${GOOGLE_WEB_APP_URL}?action=getTemplate&fileId=${ID_TEMPLATE_DIEUXE}`);
            const result = await res.json();
            const binary = window.atob(result.base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

            // Xuất từng file
            for (let i = 0; i < danhSachXeData.length; i++) {
                const data = danhSachXeData[i];
                const zip = new PizZip(bytes.buffer);
                const doc = new window.docxtemplater(zip, {
                    paragraphLoop: true, linebreaks: true,
                    nullGetter: function() { return ""; }
                });
                doc.render(data);

                const blob = doc.getZip().generate({
                    type: "blob",
                    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                });

                // Đợi 1 chút giữa các file để tránh lỗi tải
                await new Promise(r => setTimeout(r, 200));
                saveAs(blob, `Lenh_dieu_xe_${data.bien_so.replace(/\s/g, '_')}.docx`);
            }

            document.getElementById("loading").style.display = "none";
            alert(`✅ Đã xuất ${danhSachXeData.length} file Lệnh điều xe!`);

        } catch (e) {
            console.error(e);
            let msg = "Lỗi: " + e.message;
            if (e.properties && e.properties.errors) {
                msg += "\n";
                e.properties.errors.forEach(err => msg += "- " + err.message + "\n");
            }
            alert(msg);
            document.getElementById("loading").style.display = "none";
        }
    }
</script>
</body>
</html>
