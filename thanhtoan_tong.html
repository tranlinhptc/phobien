<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bảng Thanh Toán Tổng</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 10px; }
        .container { width: 100%; max-width: 720px; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin: auto; box-sizing: border-box; }
        h2 { text-align: center; color: #c00; margin-top: 0; text-transform: uppercase; font-size: 20px; }
        h3 { color: #0056b3; border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-top: 20px; font-size: 15px; }
        .form-group { margin-bottom: 12px; }
        label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 4px; color: #c00; }
        input, select, textarea { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        button { background: #28a745; color: #fff; border: none; padding: 11px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 8px; border-radius: 6px; font-size: 14px; }
        .btn-blue { background: #007bff; } .btn-orange { background: #fd7e14; } .btn-red { background: #dc3545; }
        .btn-gray { background: #6c757d; } .btn-purple { background: #6f42c1; } .btn-green { background: #20c997; }
        .btn-sm { padding: 5px 10px; font-size: 12px; width: auto; margin: 2px; }

        .ct-selector { border: 1px solid #ddd; border-radius: 8px; padding: 10px; background: #f9f9f9; margin-bottom: 12px; }
        .ct-selector .item { display: flex; align-items: flex-start; padding: 8px; background: #fff; border-radius: 6px; margin-bottom: 6px; border: 1px solid #eee; }
        .ct-selector .item input[type="checkbox"] { width: auto; margin-right: 10px; margin-top: 3px; }
        .ct-selector .item .info { flex: 1; font-size: 13px; min-width: 0; }
        .ct-selector .item .info b { color: #0056b3; }
        .ct-selector .item .info span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ct-selector .item .info small { color: #666; display: block; font-size: 11px; }
        .ct-selector .item .cost { font-size: 11px; color: #d63384; font-weight: bold; text-align: right; flex: 0 0 110px; }

        .warning-box { background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
        .warning-box b { color: #856404; }
        .warning-box ul { margin: 6px 0 0 20px; padding: 0; color: #856404; }

        .error-box { background: #f8d7da; border-left: 4px solid #dc3545; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; color: #721c24; }

        .import-section { border: 1px dashed #6c757d; border-radius: 6px; padding: 10px; margin-bottom: 12px; background: #f8f9fa; }
        .import-section .title { font-weight: bold; font-size: 13px; color: #0056b3; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .import-section .title span.total { color: #d63384; }

        table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
        th, td { border: 1px solid #999; padding: 4px; text-align: center; }
        th { background: #e9ecef; font-size: 11px; }
        .money { font-weight: bold; color: #d63384; }
        .total-row { background: #fff3cd; font-weight: bold; }

        .info-text { font-size: 12px; color: #666; font-style: italic; }
        #loading { display: none; position: fixed; inset: 0; z-index: 99999; background: rgba(255,255,255,.9); align-items: center; justify-content: center; color: #007bff; font-weight: bold; font-size: 18px; }
        .note { font-size: 11px; color: #666; font-style: italic; margin: 4px 0; }
        .header-actions { display: flex; gap: 6px; margin-bottom: 10px; }
        .header-actions button { margin: 0; padding: 8px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <button class="btn-red" onclick="location.href='index.html'">← Trang chủ</button>
    </div>

    <h2>BẢNG THANH TOÁN TỔNG</h2>

    <div class="form-group">
        <label>Ngày lập phiếu thanh toán:</label>
        <input type="date" id="ngayLap">
    </div>
    <div class="form-group">
        <label>Người đề nghị thanh toán:</label>
        <select id="nguoiDeNghi">
            <option value="">-- Chọn --</option>
        </select>
    </div>

    <h3>Chọn công tác để thanh toán</h3>
    <div id="ctSelector"></div>

    <h3>Import hóa đơn phát sinh (tùy chọn)</h3>
    <p class="note">Chỉ dùng cho hóa đơn phát sinh ngoài các module Đề cương / Điều xe / NL.</p>

    <!-- Phòng nghỉ -->
    <div class="import-section">
        <div class="title">
            <span>🏨 Phòng nghỉ</span>
            <span class="total">Tổng: <b id="tongPhongNghi">0</b> đồng</span>
        </div>
        <button class="btn-blue btn-sm" onclick="document.getElementById('filePhongNghi').click()">📥 Import XML phòng nghỉ</button>
        <input type="file" id="filePhongNghi" multiple accept=".xml" style="display:none;">
        <div id="dsPhongNghi" style="margin-top:8px;"></div>
    </div>

    <!-- Cước đường bộ -->
    <div class="import-section">
        <div class="title">
            <span>🛣️ Cước đường bộ</span>
            <span class="total">Tổng: <b id="tongCuocDuong">0</b> đồng</span>
        </div>
        <button class="btn-blue btn-sm" onclick="document.getElementById('fileCuocDuong').click()">📥 Import XML cước đường bộ</button>
        <input type="file" id="fileCuocDuong" multiple accept=".xml" style="display:none;">
        <div id="dsCuocDuong" style="margin-top:8px;"></div>
    </div>

    <h3>Xem trước chi phí</h3>
    <div id="preview"></div>

    <button class="btn-orange" onclick="xuatWord()">📄 Xuất Phiếu thanh toán tổng Word</button>
</div>

<div id="loading">⏳ Đang xử lý, chờ xíu...</div>

<script>
    // ============ CẤU HÌNH ============
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlM-814su7_q0yS7Qx1bdwC1j9CB18Km6UOdMcJW4ifZUecl633RmEhvxnsUIwerlE/exec";
    const ID_TEMPLATE_TONG = "THAY_ID_FILE_WORD_MAU_TONG";
    const MUC_CTP = 250000;

    // Key lưu 2 khoản phát sinh
    const KEY_PHONG_NGHI = 'db_phongnghi';
    const KEY_CUOC_DUONG = 'db_cuocduong';

    // ============ STATE ============
    let dbCongTac = {};
    let dbPhongNghi = {}; // { "CT-id": [{so_hd, ngay, so_tien, noi_dung}, ...] }
    let dbCuocDuong = {};

    // ============ KHỞI TẠO ============
    window.onload = function() {
        try {
            dbCongTac = JSON.parse(localStorage.getItem('db_congtac') || '{}');
            dbPhongNghi = JSON.parse(localStorage.getItem(KEY_PHONG_NGHI) || '{}');
            dbCuocDuong = JSON.parse(localStorage.getItem(KEY_CUOC_DUONG) || '{}');
        } catch (e) {
            console.error("Lỗi parse:", e);
            dbCongTac = {}; dbPhongNghi = {}; dbCuocDuong = {};
        }

        // Ngày lập = hôm nay
        const today = new Date();
        document.getElementById('ngayLap').value =
            `${today.getFullYear()}-${('0'+(today.getMonth()+1)).slice(-2)}-${('0'+today.getDate()).slice(-2)}`;

        try {
            renderNguoiDeNghi();
            renderCTSelector();
            renderBangPhongNghi();
            renderBangCuocDuong();
            updatePreview();
        } catch (e) {
            console.error("Lỗi khởi tạo:", e);
            document.getElementById('ctSelector').innerHTML =
                `<div class="error-box">⚠️ Lỗi: ${e.message}. Mở Console (F12) xem chi tiết.</div>`;
        }

        // Gắn sự kiện import
        document.getElementById('filePhongNghi').onchange = (e) => xuLyXMLPhongNghi(e.target);
        document.getElementById('fileCuocDuong').onchange = (e) => xuLyXMLCuocDuong(e.target);
    };

    // ============ DROPDOWN NGƯỜI ĐỀ NGHỊ ============
    function renderNguoiDeNghi() {
        const dsNguoi = new Set();
        Object.values(dbCongTac).forEach(ct => {
            if (ct.decuong && ct.decuong.selectedRoles) {
                Object.keys(ct.decuong.selectedRoles).forEach(n => dsNguoi.add(n));
            }
            if (ct.danhsach && ct.danhsach.danhSach) {
                ct.danhsach.danhSach.forEach(n => dsNguoi.add(n.ten));
            }
            if (ct.dieuxe && ct.dieuxe.xeList) {
                ct.dieuxe.xeList.forEach(x => { if (x.laiXe) dsNguoi.add(x.laiXe); });
            }
        });

        // Sắp xếp theo tên
        const arr = [...dsNguoi].sort();
        const sel = document.getElementById('nguoiDeNghi');
        sel.innerHTML = '<option value="">-- Chọn --</option>' +
            arr.map(n => `<option value="${n.replace(/"/g,'&quot;')}">${n}</option>`).join('');

        // Mặc định = Nguyễn Xuân Khánh nếu có
        if (arr.includes('Nguyễn Xuân Khánh')) sel.value = 'Nguyễn Xuân Khánh';
        else if (arr.length > 0) sel.value = arr[0];
    }

    // ============ RENDER DANH SÁCH CT ============
    function renderCTSelector() {
        const container = document.getElementById('ctSelector');
        let dsCT = Object.values(dbCongTac).sort((a, b) => (b.ngayBatDau || '').localeCompare(a.ngayBatDau || ''));

        if (dsCT.length === 0) {
            container.innerHTML = `<div class="error-box">
                ⚠️ <b>Chưa có công tác nào.</b><br>Vào <a href="index.html">Trang chủ</a> tạo công tác trước.
            </div>`;
            return;
        }

        let html = '';
        dsCT.forEach(ct => {
            const cp = tinhChiPhiCT(ct);
            const mods = [];
            if (ct.decuong) mods.push('ĐC');
            if (ct.dieuxe) mods.push('ĐX');
            if (ct.danhsach) mods.push('DS');
            if (ct.nhienlieu) mods.push('NL');
            if (dbPhongNghi[ct.id] && dbPhongNghi[ct.id].length > 0) mods.push('PN');
            if (dbCuocDuong[ct.id] && dbCuocDuong[ct.id].length > 0) mods.push('CĐ');
            const modStr = mods.length > 0 ? `[${mods.join('+')}]` : '[chưa có dữ liệu]';

            html += `<div class="item">
                <input type="checkbox" class="ct-check" data-id="${ct.id}" checked onchange="updatePreview()">
                <div class="info">
                    <b>${ct.id}</b> <small style="color:#28a745;">${modStr}</small>
                    <span>${escapeHtml(ct.tenCongTac || '(chưa có tên)')}</span>
                    <small>📅 ${formatDate(ct.ngayBatDau)}${ct.ngayKetThuc && ct.ngayKetThuc !== ct.ngayBatDau ? ' → ' + formatDate(ct.ngayKetThuc) : ''}</small>
                </div>
                <div class="cost">
                    NL: ${cp.tongNhienLieu.toLocaleString('vi-VN')}<br>
                    CTP: ${cp.tongCTP.toLocaleString('vi-VN')}<br>
                    PN: ${cp.tongPhongNghi.toLocaleString('vi-VN')}<br>
                    CĐ: ${cp.tongCuocDuong.toLocaleString('vi-VN')}<br>
                    <b>Σ: ${cp.tong.toLocaleString('vi-VN')}</b>
                </div>
            </div>`;
        });
        container.innerHTML = html;
    }

    // ============ TÍNH CHI PHÍ 1 CT ============
    function tinhChiPhiCT(ct) {
        // Nhiên liệu
        let tongNhienLieu = 0;
        if (ct.nhienlieu && ct.nhienlieu.xeList) {
            ct.nhienlieu.xeList.forEach(xe => {
                (xe.congTacList || []).forEach(congTac => {
                    (congTac.hoaDon || []).forEach(hd => {
                        tongNhienLieu += parseFloat(hd.thanh_tien) || 0;
                    });
                });
            });
        }

        // CTP
        let tongCTP = 0, soNguoi = 0;
        if (ct.danhsach && ct.danhsach.danhSach) {
            soNguoi = ct.danhsach.danhSach.length;
            ct.danhsach.danhSach.forEach(n => {
                const soNgay = tinhSoNgay(n.tuNgay, n.denNgay);
                tongCTP += soNgay * MUC_CTP;
            });
        }

        // Phòng nghỉ - ưu tiên từ module import XML riêng
        let tongPhongNghi = 0;
        if (dbPhongNghi[ct.id] && dbPhongNghi[ct.id].length > 0) {
            dbPhongNghi[ct.id].forEach(hd => { tongPhongNghi += parseFloat(hd.so_tien) || 0; });
        } else if (ct.decuong && ct.decuong.soPhong && ct.decuong.soDem && ct.decuong.giaPhong) {
            // Fallback: dùng dự trù Đề cương
            tongPhongNghi = (parseFloat(ct.decuong.soPhong) || 0)
                * (parseFloat(ct.decuong.soDem) || 0)
                * (parseFloat(ct.decuong.giaPhong) || 0);
        }

        // Cước đường bộ
        let tongCuocDuong = 0;
        if (dbCuocDuong[ct.id] && dbCuocDuong[ct.id].length > 0) {
            dbCuocDuong[ct.id].forEach(hd => { tongCuocDuong += parseFloat(hd.so_tien) || 0; });
        }

        return {
            tongNhienLieu, tongCTP, tongPhongNghi, tongCuocDuong, soNguoi,
            tong: tongNhienLieu + tongCTP + tongPhongNghi + tongCuocDuong
        };
    }

    function tinhSoNgay(tuNgay, denNgay) {
        if (!tuNgay || !denNgay) return 0;
        const parse = (s) => {
            if (s.includes('/')) {
                const [d, m, y] = s.split('/');
                return new Date(`${y}-${m}-${d}`);
            }
            return new Date(s);
        };
        const d1 = parse(tuNgay), d2 = parse(denNgay);
        if (isNaN(d1) || isNaN(d2)) return 0;
        const diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
        return diff > 0 ? diff : 1;
    }

    // ============ IMPORT XML PHÒNG NGHỈ ============
    function xuLyXMLPhongNghi(input) {
        const files = input.files;
        if (files.length === 0) return;

        // Lưu vào công tác nào? Không xác định được từ XML → gán cho CT đang tick đầu tiên
        const ctDangChon = document.querySelector('.ct-check:checked');
        if (!ctDangChon) { alert("Vui lòng tick chọn 1 công tác trước khi import!"); input.value = ''; return; }
        const ctId = ctDangChon.dataset.id;

        if (!dbPhongNghi[ctId]) dbPhongNghi[ctId] = [];

        let pending = files.length;
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const xmlDoc = new DOMParser().parseFromString(e.target.result, "text/xml");
                    const soHoaDon = xmlDoc.querySelector("SHDon")?.textContent || "N/A";
                    const ngayLap = xmlDoc.querySelector("NLap")?.textContent || "";
                    const tongTien = parseFloat(xmlDoc.querySelector("TgTTTBSo")?.textContent || "0");

                    dbPhongNghi[ctId].push({
                        so_hd: soHoaDon,
                        ngay: ngayLap,
                        so_tien: tongTien,
                        noi_dung: "Phòng nghỉ"
                    });
                } catch (err) {
                    console.error("Lỗi XML phòng nghỉ:", err);
                }
                pending--;
                if (pending === 0) {
                    localStorage.setItem(KEY_PHONG_NGHI, JSON.stringify(dbPhongNghi));
                    renderBangPhongNghi();
                    renderCTSelector();
                    updatePreview();
                }
            };
            reader.readAsText(file);
        });
        input.value = '';
    }

    function renderBangPhongNghi() {
        const container = document.getElementById('dsPhongNghi');
        let html = '';
        let tongAll = 0;
        Object.keys(dbPhongNghi).forEach(ctId => {
            const list = dbPhongNghi[ctId];
            if (list.length === 0) return;
            const tong = list.reduce((s, h) => s + h.so_tien, 0);
            tongAll += tong;
            html += `<div style="margin-bottom:8px; padding:6px; background:#fff; border-radius:4px; border:1px solid #ddd;">
                <div style="font-weight:bold; font-size:12px; color:#0056b3;">${ctId} - Tổng: ${tong.toLocaleString('vi-VN')} đ</div>
                <table><thead><tr><th>STT</th><th>Số HĐ</th><th>Ngày</th><th>Số tiền</th><th>X</th></tr></thead><tbody>
                ${list.map((h, i) => `<tr>
                    <td>${i+1}</td><td>${h.so_hd}</td><td>${h.ngay}</td>
                    <td>${h.so_tien.toLocaleString('vi-VN')}</td>
                    <td><button class="btn-red btn-sm" onclick="xoaPhongNghi('${ctId}', ${i})">X</button></td>
                </tr>`).join('')}
                </tbody></table>
            </div>`;
        });
        container.innerHTML = html || '<p class="info-text">Chưa có hóa đơn phòng nghỉ.</p>';
        document.getElementById('tongPhongNghi').innerText = tongAll.toLocaleString('vi-VN');
    }

    function xoaPhongNghi(ctId, idx) {
        dbPhongNghi[ctId].splice(idx, 1);
        if (dbPhongNghi[ctId].length === 0) delete dbPhongNghi[ctId];
        localStorage.setItem(KEY_PHONG_NGHI, JSON.stringify(dbPhongNghi));
        renderBangPhongNghi();
        renderCTSelector();
        updatePreview();
    }

    // ============ IMPORT XML CƯỚC ĐƯỜNG ============
    function xuLyXMLCuocDuong(input) {
        const files = input.files;
        if (files.length === 0) return;

        const ctDangChon = document.querySelector('.ct-check:checked');
        if (!ctDangChon) { alert("Vui lòng tick chọn 1 công tác trước khi import!"); input.value = ''; return; }
        const ctId = ctDangChon.dataset.id;

        if (!dbCuocDuong[ctId]) dbCuocDuong[ctId] = [];

        let pending = files.length;
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const xmlDoc = new DOMParser().parseFromString(e.target.result, "text/xml");
                    const soHoaDon = xmlDoc.querySelector("SHDon")?.textContent || "N/A";
                    const ngayLap = xmlDoc.querySelector("NLap")?.textContent || "";
                    const tongTien = parseFloat(xmlDoc.querySelector("TgTTTBSo")?.textContent || "0");

                    dbCuocDuong[ctId].push({
                        so_hd: soHoaDon,
                        ngay: ngayLap,
                        so_tien: tongTien,
                        noi_dung: "Cước đường bộ"
                    });
                } catch (err) {
                    console.error("Lỗi XML cước đường:", err);
                }
                pending--;
                if (pending === 0) {
                    localStorage.setItem(KEY_CUOC_DUONG, JSON.stringify(dbCuocDuong));
                    renderBangCuocDuong();
                    renderCTSelector();
                    updatePreview();
                }
            };
            reader.readAsText(file);
        });
        input.value = '';
    }

    function renderBangCuocDuong() {
        const container = document.getElementById('dsCuocDuong');
        let html = '';
        let tongAll = 0;
        Object.keys(dbCuocDuong).forEach(ctId => {
            const list = dbCuocDuong[ctId];
            if (list.length === 0) return;
            const tong = list.reduce((s, h) => s + h.so_tien, 0);
            tongAll += tong;
            html += `<div style="margin-bottom:8px; padding:6px; background:#fff; border-radius:4px; border:1px solid #ddd;">
                <div style="font-weight:bold; font-size:12px; color:#0056b3;">${ctId} - Tổng: ${tong.toLocaleString('vi-VN')} đ</div>
                <table><thead><tr><th>STT</th><th>Số HĐ</th><th>Ngày</th><th>Số tiền</th><th>X</th></tr></thead><tbody>
                ${list.map((h, i) => `<tr>
                    <td>${i+1}</td><td>${h.so_hd}</td><td>${h.ngay}</td>
                    <td>${h.so_tien.toLocaleString('vi-VN')}</td>
                    <td><button class="btn-red btn-sm" onclick="xoaCuocDuong('${ctId}', ${i})">X</button></td>
                </tr>`).join('')}
                </tbody></table>
            </div>`;
        });
        container.innerHTML = html || '<p class="info-text">Chưa có hóa đơn cước đường bộ.</p>';
        document.getElementById('tongCuocDuong').innerText = tongAll.toLocaleString('vi-VN');
    }

    function xoaCuocDuong(ctId, idx) {
        dbCuocDuong[ctId].splice(idx, 1);
        if (dbCuocDuong[ctId].length === 0) delete dbCuocDuong[ctId];
        localStorage.setItem(KEY_CUOC_DUONG, JSON.stringify(dbCuocDuong));
        renderBangCuocDuong();
        renderCTSelector();
        updatePreview();
    }

    // ============ XEM TRƯỚC ============
    function updatePreview() {
        const dsCTChon = [];
        document.querySelectorAll('.ct-check:checked').forEach(cb => {
            const id = cb.dataset.id;
            if (dbCongTac[id]) dsCTChon.push(dbCongTac[id]);
        });

        let tongNL = 0, tongCTP = 0, tongPN = 0, tongCD = 0;
        dsCTChon.forEach(ct => {
            const cp = tinhChiPhiCT(ct);
            tongNL += cp.tongNhienLieu;
            tongCTP += cp.tongCTP;
            tongPN += cp.tongPhongNghi;
            tongCD += cp.tongCuocDuong;
        });
        const tongAll = tongNL + tongCTP + tongPN + tongCD;
        const canhBao = kiemTraTrungCTP(dsCTChon);

        let warningHtml = '';
        if (canhBao.length > 0) {
            warningHtml = `<div class="warning-box">
                <b>⚠️ Cảnh báo trùng CTP (${canhBao.length} trường hợp):</b>
                <ul>${canhBao.map(c => `<li>${c.ten} - ngày ${formatDate(c.ngay)} - CT: ${c.dsCT.join(', ')}</li>`).join('')}</ul>
            </div>`;
        }

        document.getElementById('preview').innerHTML = `

    // ============ CẢNH BÁO TRÙNG CTP ============
    function kiemTraTrungCTP(dsCTChon) {
        const map = {};
        dsCTChon.forEach(ct => {
            if (!ct.danhsach || !ct.danhsach.danhSach) return;
            ct.danhsach.danhSach.forEach(n => {
                const ngayList = lietKeNgay(n.tuNgay, n.denNgay);
                if (!map[n.ten]) map[n.ten] = {};
                ngayList.forEach(ngay => {
                    if (!map[n.ten][ngay]) map[n.ten][ngay] = [];
                    map[n.ten][ngay].push(ct.id);
                });
            });
        });
        const canhBao = [];
        Object.keys(map).forEach(ten => {
            Object.keys(map[ten]).forEach(ngay => {
                if (map[ten][ngay].length > 1) canhBao.push({ ten, ngay, dsCT: map[ten][ngay] });
            });
        });
        return canhBao;
    }

    function lietKeNgay(tuNgay, denNgay) {
        const parse = (s) => {
            if (!s) return null;
            if (s.includes('/')) {
                const [d, m, y] = s.split('/');
                return new Date(`${y}-${m}-${d}`);
            }
            return new Date(s);
        };
        const d1 = parse(tuNgay), d2 = parse(denNgay);
        if (!d1 || !d2 || isNaN(d1) || isNaN(d2)) return [];
        const list = [];
        const cur = new Date(d1);
        while (cur <= d2) {
            list.push(`${cur.getFullYear()}-${('0'+(cur.getMonth()+1)).slice(-2)}-${('0'+cur.getDate()).slice(-2)}`);
            cur.setDate(cur.getDate() + 1);
        }
        return list;
    }
