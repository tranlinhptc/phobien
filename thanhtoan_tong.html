<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bảng Thanh Toán Tổng</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 10px; }
        .container { width: 100%; max-width: 720px; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin: auto; box-sizing: border-box; }
        h2 { text-align: center; color: #c00; margin-top: 0; text-transform: uppercase; font-size: 20px; }
        h3 { color: #0056b3; border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-top: 20px; font-size: 15px; }
        .form-group { margin-bottom: 12px; }
        label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 4px; color: #c00; }
        input, select, textarea { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        button { background: #28a745; color: #fff; border: none; padding: 11px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 8px; border-radius: 6px; font-size: 14px; }
        .btn-blue { background: #007bff; } .btn-orange { background: #fd7e14; } .btn-red { background: #dc3545; }
        .btn-gray { background: #6c757d; } .btn-purple { background: #6f42c1; } .btn-green { background: #20c997; }
        .btn-sm { padding: 5px 10px; font-size: 12px; width: auto; margin: 2px; }

        .ct-selector { border: 1px solid #ddd; border-radius: 8px; padding: 10px; background: #f9f9f9; margin-bottom: 12px; }
        .ct-selector .item { padding: 10px; background: #fff; border-radius: 6px; margin-bottom: 8px; border: 1px solid #eee; }
        .ct-selector .item .row-top { display: flex; align-items: flex-start; gap: 10px; }
        .ct-selector .item input[type="checkbox"] { width: auto; margin-top: 4px; flex: 0 0 auto; }
        .ct-selector .item .info { flex: 1; font-size: 13px; min-width: 0; }
        .ct-selector .item .info b { color: #0056b3; }
        .ct-selector .item .info span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ct-selector .item .info small { color: #666; display: block; font-size: 11px; }
        .ct-selector .item .cost { font-size: 11px; color: #d63384; font-weight: bold; text-align: right; flex: 0 0 120px; }
        .ct-selector .item .btn-row { display: flex; gap: 6px; margin-top: 8px; margin-left: 26px; }
        .ct-selector .item .btn-row button { flex: 1; padding: 6px 4px; font-size: 11px; font-weight: bold; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .btn-xml-pn { background: #e83e8c; }
        .btn-xml-cd { background: #6f42c1; }

        .warning-box { background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
        .warning-box b { color: #856404; }
        .warning-box ul { margin: 6px 0 0 20px; padding: 0; color: #856404; }

        .error-box { background: #f8d7da; border-left: 4px solid #dc3545; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; color: #721c24; }

        .bill-list { margin-top: 8px; margin-left: 26px; padding: 6px; background: #f8f9fa; border-radius: 4px; font-size: 11px; }
        .bill-list .bill-row { display: flex; justify-content: space-between; padding: 3px 4px; border-bottom: 1px dashed #ddd; }
        .bill-list .bill-row:last-child { border-bottom: none; }
        .bill-list .bill-row .del { color: #dc3545; cursor: pointer; font-weight: bold; margin-left: 6px; }

        table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
        th, td { border: 1px solid #999; padding: 4px; text-align: center; }
        th { background: #e9ecef; font-size: 11px; }
        .money { font-weight: bold; color: #d63384; }
        .total-row { background: #fff3cd; font-weight: bold; }

        .info-text { font-size: 12px; color: #666; font-style: italic; }
        #loading { display: none; position: fixed; inset: 0; z-index: 99999; background: rgba(255,255,255,.9); align-items: center; justify-content: center; color: #007bff; font-weight: bold; font-size: 18px; }
        .note { font-size: 11px; color: #666; font-style: italic; margin: 4px 0; }
        .header-actions { display: flex; gap: 6px; margin-bottom: 10px; }
        .header-actions button { margin: 0; padding: 8px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <button class="btn-red" onclick="location.href='index.html'">← Trang chủ</button>
    </div>

    <h2>BẢNG THANH TOÁN TỔNG</h2>

    <div class="form-group">
        <label>Ngày lập phiếu thanh toán:</label>
        <input type="date" id="ngayLap">
    </div>
    <div class="form-group">
        <label>Người đề nghị thanh toán:</label>
        <select id="nguoiDeNghi">
            <option value="">-- Đang tải... --</option>
        </select>
    </div>

    <h3>Chọn công tác để thanh toán</h3>
    <p class="note">Bấm 📥 nếu cần thêm hóa đơn phòng nghỉ / cước đường bộ cho từng công tác.</p>
    <div id="ctSelector"></div>

    <h3>Xem trước chi phí</h3>
    <div id="preview"></div>

    <button class="btn-orange" onclick="xuatWord()">📄 Xuất Phiếu thanh toán tổng Word</button>
</div>

<div id="loading">⏳ Đang xử lý, chờ xíu...</div>

<script>
    // ============ CẤU HÌNH ============
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlM-814su7_q0yS7Qx1bdwC1j9CB18Km6UOdMcJW4ifZUecl633RmEhvxnsUIwerlE/exec";
    const ID_TEMPLATE_TONG = "1uI0rtEA01OYJfKecfZnJEtMW56-4gVVx";
    const MUC_CTP_1_NGAY = 100000;
    const MUC_CTP_NHIEU_NGAY = 250000;
    const KEY_PHONG_NGHI = 'db_phongnghi';
    const KEY_CUOC_DUONG = 'db_cuocduong';

    // ============ STATE ============
    let dbCongTac = {};
    let dbPhongNghi = {};
    let dbCuocDuong = {};
    let importTarget = { ctId: '', type: '' }; // Loại import: 'pn' hoặc 'cd'

    // ============ KHỞI TẠO ============
    window.onload = function() {
        try { dbCongTac = JSON.parse(localStorage.getItem('db_congtac') || '{}'); } catch (e) { dbCongTac = {}; }
        try { dbPhongNghi = JSON.parse(localStorage.getItem(KEY_PHONG_NGHI) || '{}'); } catch (e) { dbPhongNghi = {}; }
        try { dbCuocDuong = JSON.parse(localStorage.getItem(KEY_CUOC_DUONG) || '{}'); } catch (e) { dbCuocDuong = {}; }

        const today = new Date();
        document.getElementById('ngayLap').value =
            `${today.getFullYear()}-${('0'+(today.getMonth()+1)).slice(-2)}-${('0'+today.getDate()).slice(-2)}`;

        safeRun('renderNguoiDeNghi', renderNguoiDeNghi);
        safeRun('renderCTSelector', renderCTSelector);
        safeRun('updatePreview', updatePreview);

        // Gắn sự kiện import XML
        document.getElementById('fileXmlInput').onchange = (e) => xuLyXML(e.target);
    };

    function safeRun(name, fn) {
        try { fn(); } catch (e) { console.error("Lỗi " + name + ":", e); }
    }

    // ============ TÍNH SỐ NGÀY ============
    function tinhSoNgay(tuNgay, denNgay) {
        if (!tuNgay || !denNgay) return 0;
        const parse = (s) => {
            if (s.includes('/')) { const [d, m, y] = s.split('/'); return new Date(`${y}-${m}-${d}`); }
            return new Date(s);
        };
        const d1 = parse(tuNgay), d2 = parse(denNgay);
        if (isNaN(d1) || isNaN(d2)) return 0;
        const diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
        return diff > 0 ? diff : 1;
    }

    // ============ TÍNH CTP 1 NGƯỜI ============
    function tinhCTPChoNguoi(tuNgay, denNgay) {
        const soNgay = tinhSoNgay(tuNgay, denNgay);
        if (soNgay === 0) return 0;
        if (soNgay === 1) return MUC_CTP_1_NGAY;
        return soNgay * MUC_CTP_NHIEU_NGAY;
    }

    // ============ TÍNH CHI PHÍ ============
    function tinhChiPhiCT(ct) {
        // Nhiên liệu
        let tongNhienLieu = 0;
        if (ct.nhienlieu && ct.nhienlieu.xeList) {
            ct.nhienlieu.xeList.forEach(xe => {
                (xe.congTacList || []).forEach(congTac => {
                    (congTac.hoaDon || []).forEach(hd => {
                        tongNhienLieu += parseFloat(hd.thanh_tien) || 0;
                    });
                });
            });
        }

        // CTP - tính theo quy tắc 1 ngày = 100k, >=2 ngày = 250k/ngày
        let tongCTP = 0, soNguoi = 0;
        if (ct.danhsach && ct.danhsach.danhSach) {
            soNguoi = ct.danhsach.danhSach.length;
            ct.danhsach.danhSach.forEach(n => {
                tongCTP += tinhCTPChoNguoi(n.tuNgay, n.denNgay);
            });
        }

        // Phòng nghỉ
        let tongPhongNghi = 0;
        if (dbPhongNghi[ct.id] && dbPhongNghi[ct.id].length > 0) {
            dbPhongNghi[ct.id].forEach(hd => { tongPhongNghi += parseFloat(hd.so_tien) || 0; });
        } else if (ct.decuong && ct.decuong.soPhong && ct.decuong.soDem && ct.decuong.giaPhong) {
            tongPhongNghi = (parseFloat(ct.decuong.soPhong) || 0)
                * (parseFloat(ct.decuong.soDem) || 0)
                * (parseFloat(ct.decuong.giaPhong) || 0);
        }

        // Cước đường bộ
        let tongCuocDuong = 0;
        if (dbCuocDuong[ct.id] && dbCuocDuong[ct.id].length > 0) {
            dbCuocDuong[ct.id].forEach(hd => { tongCuocDuong += parseFloat(hd.so_tien) || 0; });
        }

        return {
            tongNhienLieu, tongCTP, tongPhongNghi, tongCuocDuong, soNguoi,
            tong: tongNhienLieu + tongCTP + tongPhongNghi + tongCuocDuong
        };
    }

    // ============ DROPDOWN NGƯỜI ĐỀ NGHỊ ============
    function renderNguoiDeNghi() {
        const dsNguoi = new Set();
        Object.values(dbCongTac).forEach(ct => {
            if (ct.decuong && ct.decuong.selectedRoles) Object.keys(ct.decuong.selectedRoles).forEach(n => dsNguoi.add(n));
            if (ct.danhsach && ct.danhsach.danhSach) ct.danhsach.danhSach.forEach(n => { if (n.ten) dsNguoi.add(n.ten); });
            if (ct.dieuxe && ct.dieuxe.xeList) ct.dieuxe.xeList.forEach(x => { if (x.laiXe) dsNguoi.add(x.laiXe); });
        });
        const arr = [...dsNguoi].sort();
        const sel = document.getElementById('nguoiDeNghi');
        if (arr.length === 0) { sel.innerHTML = '<option value="">-- Chưa có nhân sự nào --</option>'; return; }
        sel.innerHTML = '<option value="">-- Chọn --</option>' +
            arr.map(n => `<option value="${n.replace(/"/g,'&quot;')}">${n}</option>`).join('');
        sel.value = arr.includes('Nguyễn Xuân Khánh') ? 'Nguyễn Xuân Khánh' : arr[0];
    }

    // ============ RENDER DANH SÁCH CT ============
    function renderCTSelector() {
        const container = document.getElementById('ctSelector');
        const dsCT = Object.values(dbCongTac).sort((a, b) => (b.ngayBatDau || '').localeCompare(a.ngayBatDau || ''));

        if (dsCT.length === 0) {
            container.innerHTML = `<div class="error-box">⚠️ <b>Chưa có công tác nào.</b><br>Vào <a href="index.html">Trang chủ</a> tạo trước.</div>`;
            return;
        }

        let html = '';
        dsCT.forEach(ct => {
            const cp = tinhChiPhiCT(ct);

            // Bill lists
            const pnHtml = renderBillList('pn', ct.id, dbPhongNghi[ct.id] || []);
            const cdHtml = renderBillList('cd', ct.id, dbCuocDuong[ct.id] || []);

            html += `<div class="item">
                <div class="row-top">
                    <input type="checkbox" class="ct-check" data-id="${ct.id}" checked onchange="safeRun('updatePreview', updatePreview)">
                    <div class="info">
                        <b>${ct.id}</b>
                        <span>${escapeHtml(ct.tenCongTac || '(chưa có tên)')}</span>
                        <small>📅 ${formatDate(ct.ngayBatDau)}${ct.ngayKetThuc && ct.ngayKetThuc !== ct.ngayBatDau ? ' → ' + formatDate(ct.ngayKetThuc) : ''}</small>
                    </div>
                    <div class="cost">
                        NL: ${cp.tongNhienLieu.toLocaleString('vi-VN')}<br>
                        CTP: ${cp.tongCTP.toLocaleString('vi-VN')}<br>
                        PN: ${cp.tongPhongNghi.toLocaleString('vi-VN')}<br>
                        CĐ: ${cp.tongCuocDuong.toLocaleString('vi-VN')}<br>
                        <b>Σ: ${cp.tong.toLocaleString('vi-VN')}</b>
                    </div>
                </div>
                <div class="btn-row">
                    <button class="btn-xml-pn" onclick="openImport('${ct.id}', 'pn')">🏨 +XML Phòng nghỉ</button>
                    <button class="btn-xml-cd" onclick="openImport('${ct.id}', 'cd')">🛣️ +XML Cước đường</button>
                </div>
                ${pnHtml}
                ${cdHtml}
            </div>`;
        });
        container.innerHTML = html;
    }

    function renderBillList(type, ctId, list) {
        if (!list || list.length === 0) return '';
        const tong = list.reduce((s, h) => s + (parseFloat(h.so_tien) || 0), 0);
        const label = type === 'pn' ? 'PN' : 'CĐ';
        let html = `<div class="bill-list">
            <div style="font-weight:bold; font-size:11px; color:#0056b3; margin-bottom:4px;">${label} ${ctId} (${list.length} hóa đơn) - Tổng: ${tong.toLocaleString('vi-VN')} đ</div>`;
        list.forEach((h, i) => {
            html += `<div class="bill-row">
                <span>HĐ ${h.so_hd} - ${h.ngay} - ${(parseFloat(h.so_tien) || 0).toLocaleString('vi-VN')}</span>
                <span class="del" onclick="xoaHoaDon('${type}', '${ctId}', ${i})">✕</span>
            </div>`;
        });
        html += `</div>`;
        return html;
    }

    // ============ XÓA HÓA ĐƠN ============
    function xoaHoaDon(type, ctId, idx) {
        const db = type === 'pn' ? dbPhongNghi : dbCuocDuong;
        const key = type === 'pn' ? KEY_PHONG_NGHI : KEY_CUOC_DUONG;
        if (!db[ctId]) return;
        db[ctId].splice(idx, 1);
        if (db[ctId].length === 0) delete db[ctId];
        localStorage.setItem(key, JSON.stringify(db));
        renderCTSelector();
        updatePreview();
    }

    // ============ MỞ IMPORT (tạo input file ẩn động) ============
    function openImport(ctId, type) {
        importTarget = { ctId: ctId, type: type };
        document.getElementById('fileXmlInput').click();
    }

    // ============ XỬ LÝ FILE XML ============
    async function xuLyXML(input) {
        const files = input.files;
        if (files.length === 0) return;

        const { ctId, type } = importTarget;
        if (!ctId || !type) return;

        const db = type === 'pn' ? dbPhongNghi : dbCuocDuong;
        const key = type === 'pn' ? KEY_PHONG_NGHI : KEY_CUOC_DUONG;
        if (!db[ctId]) db[ctId] = [];

        let count = 0;
        for (const file of Array.from(files)) {
            const hd = await docXMLFile(file);
            if (hd) {
                hd.noi_dung = type === 'pn' ? "Phòng nghỉ" : "Cước đường bộ";
                db[ctId].push(hd);
                count++;
            }
        }

        localStorage.setItem(key, JSON.stringify(db));
        renderCTSelector();
        updatePreview();
        input.value = '';
        alert(`✅ Đã import ${count} file ${type === 'pn' ? 'phòng nghỉ' : 'cước đường'} vào ${ctId}`);
    }

    function docXMLFile(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const xmlDoc = new DOMParser().parseFromString(e.target.result, "text/xml");
                    const soHoaDon = xmlDoc.querySelector("SHDon")?.textContent || "N/A";
                    const ngayLap = xmlDoc.querySelector("NLap")?.textContent || "";
                    const tongTien = parseFloat(xmlDoc.querySelector("TgTTTBSo")?.textContent || "0");
                    resolve({ so_hd: soHoaDon, ngay: ngayLap, so_tien: tongTien });
                } catch (err) {
                    console.error("Lỗi XML:", file.name, err);
                    resolve(null);
                }
            };
            reader.readAsText(file);
        });
    }

    // ============ XEM TRƯỚC ============
    function updatePreview() {
        const dsCTChon = [];
        document.querySelectorAll('.ct-check:checked').forEach(cb => {
            const id = cb.dataset.id;
            if (dbCongTac[id]) dsCTChon.push(dbCongTac[id]);
        });

        let tongNL = 0, tongCTP = 0, tongPN = 0, tongCD = 0;
        dsCTChon.forEach(ct => {
            const cp = tinhChiPhiCT(ct);
            tongNL += cp.tongNhienLieu;
            tongCTP += cp.tongCTP;
            tongPN += cp.tongPhongNghi;
            tongCD += cp.tongCuocDuong;
        });
        const tongAll = tongNL + tongCTP + tongPN + tongCD;
        const canhBao = kiemTraTrungCTP(dsCTChon);

        let warningHtml = '';
        if (canhBao.length > 0) {
            warningHtml = `<div class="warning-box">
                <b>⚠️ Cảnh báo trùng ngày công tác (${canhBao.length} trường hợp):</b>
                <ul>${canhBao.slice(0, 10).map(c => `<li>${c.ten} - ${formatDate(c.ngay)} - CT: ${c.dsCT.join(', ')}</li>`).join('')}</ul>
                ${canhBao.length > 10 ? `<small>... và ${canhBao.length - 10} trường hợp khác</small>` : ''}
            </div>`;
        }

        document.getElementById('preview').innerHTML = `
            ${warningHtml}
            <table>
                <tr><td style="text-align:left;">Số công tác:</td><td><b>${dsCTChon.length}</b></td></tr>
                <tr><td style="text-align:left;">Nhiên liệu:</td><td class="money">${tongNL.toLocaleString('vi-VN')} đồng</td></tr>
                <tr><td style="text-align:left;">Công tác phí:</td><td class="money">${tongCTP.toLocaleString('vi-VN')} đồng</td></tr>
                <tr><td style="text-align:left;">Phòng nghỉ:</td><td class="money">${tongPN.toLocaleString('vi-VN')} đồng</td></tr>
                <tr><td style="text-align:left;">Cước đường bộ:</td><td class="money">${tongCD.toLocaleString('vi-VN')} đồng</td></tr>
                <tr class="total-row"><td style="text-align:left;">TỔNG CỘNG:</td><td class="money">${tongAll.toLocaleString('vi-VN')} đồng</td></tr>
            </table>
        `;
    }

    // ============ CẢNH BÁO TRÙNG NGÀY ============
    function kiemTraTrungCTP(dsCTChon) {
        const map = {};
        dsCTChon.forEach(ct => {
            if (!ct.danhsach || !ct.danhsach.danhSach) return;
            ct.danhsach.danhSach.forEach(n => {
                const ngayList = lietKeNgay(n.tuNgay, n.denNgay);
                if (!map[n.ten]) map[n.ten] = {};
                ngayList.forEach(ngay => {
                    if (!map[n.ten][ngay]) map[n.ten][ngay] = [];
                    map[n.ten][ngay].push(ct.id);
                });
            });
        });
        const canhBao = [];
        Object.keys(map).forEach(ten => {
            Object.keys(map[ten]).forEach(ngay => {
                if (map[ten][ngay].length > 1) canhBao.push({ ten, ngay, dsCT: map[ten][ngay] });
            });
        });
        return canhBao;
    }

    function lietKeNgay(tuNgay, denNgay) {
        const parse = (s) => {
            if (!s) return null;
            if (s.includes('/')) { const [d, m, y] = s.split('/'); return new Date(`${y}-${m}-${d}`); }
            return new Date(s);
        };
        const d1 = parse(tuNgay), d2 = parse(denNgay);
        if (!d1 || !d2 || isNaN(d1) || isNaN(d2)) return [];
        const list = [];
        const cur = new Date(d1);
        while (cur <= d2) {
            list.push(`${cur.getFullYear()}-${('0'+(cur.getMonth()+1)).slice(-2)}-${('0'+cur.getDate()).slice(-2)}`);
            cur.setDate(cur.getDate() + 1);
        }
        return list;
    }

    // ============ XUẤT WORD ============
    async function xuatWord() {
        const dsCTChon = [];
        document.querySelectorAll('.ct-check:checked').forEach(cb => {
            const id = cb.dataset.id;
            if (dbCongTac[id]) dsCTChon.push(dbCongTac[id]);
        });

        if (dsCTChon.length === 0) { alert("Chưa chọn công tác nào!"); return; }
        const nguoiDeNghi = document.getElementById('nguoiDeNghi').value;
        if (!nguoiDeNghi) { alert("Chưa chọn người đề nghị thanh toán!"); return; }

        document.getElementById("loading").style.display = "flex";
        const ngayLapObj = splitDate(document.getElementById('ngayLap').value);

        const bangChiPhi = [];
        let tongToanBo = 0;

        dsCTChon.forEach((ct, idx) => {
            const cp = tinhChiPhiCT(ct);
            const chiTiet = [];

            // Nhiên liệu
            if (ct.nhienlieu && ct.nhienlieu.xeList) {
                ct.nhienlieu.xeList.forEach(xe => {
                    let tongXe = 0; const dsHD = [];
                    (xe.congTacList || []).forEach(congTac => {
                        (congTac.hoaDon || []).forEach(hd => {
                            tongXe += parseFloat(hd.thanh_tien) || 0;
                            if (hd.so_hd) dsHD.push(hd.so_hd);
                        });
                    });
                    if (tongXe > 0) chiTiet.push({
                        ten: `Nhiên liệu xe ${xe.bienSo}${dsHD.length ? ' (HĐ ' + dsHD.join(', ') + ')' : ''}`,
                        so_tien: tongXe.toLocaleString('vi-VN')
                    });
                });
            }

            // Phòng nghỉ
            if (dbPhongNghi[ct.id] && dbPhongNghi[ct.id].length > 0) {
                const dsHD = dbPhongNghi[ct.id].map(h => h.so_hd).filter(v => v);
                chiTiet.push({
                    ten: `Phòng nghỉ${dsHD.length ? ' (HĐ ' + dsHD.join(', ') + ')' : ''}`,
                    so_tien: cp.tongPhongNghi.toLocaleString('vi-VN')
                });
            } else if (cp.tongPhongNghi > 0) {
                chiTiet.push({ ten: `Phòng nghỉ`, so_tien: cp.tongPhongNghi.toLocaleString('vi-VN') });
            }

            // Cước đường bộ
            if (dbCuocDuong[ct.id] && dbCuocDuong[ct.id].length > 0) {
                const dsHD = dbCuocDuong[ct.id].map(h => h.so_hd).filter(v => v);
                chiTiet.push({
                    ten: `Cước đường bộ${dsHD.length ? ' (HĐ ' + dsHD.join(', ') + ')' : ''}`,
                    so_tien: cp.tongCuocDuong.toLocaleString('vi-VN')
                });
            }

            // CTP
            if (cp.tongCTP > 0) {
                chiTiet.push({ ten: `Phụ cấp lưu trú (${cp.soNguoi} người)`, so_tien: cp.tongCTP.toLocaleString('vi-VN') });
            }

            tongToanBo += cp.tong;
            bangChiPhi.push({
                stt_la_ma: ['I','II','III','IV','V','VI','VII','VIII','IX','X'][idx] || (idx + 1),
                ten_cong_tac: ct.tenCongTac,
                tong_ct: cp.tong.toLocaleString('vi-VN'),
                chi_tiet: chiTiet
            });
        });

        // Bảng CTP chi tiết
        const bangCTP = [];
        const theoNguoi = {};
        dsCTChon.forEach(ct => {
            if (!ct.danhsach || !ct.danhsach.danhSach) return;
            ct.danhsach.danhSach.forEach(n => {
                const tien = tinhCTPChoNguoi(n.tuNgay, n.denNgay);
                const soNgay = tinhSoNgay(n.tuNgay, n.denNgay);
                if (!theoNguoi[n.ten]) theoNguoi[n.ten] = { so_ngay: 0, thanh_tien: 0, ghi_chu: [] };
                theoNguoi[n.ten].so_ngay += soNgay;
                theoNguoi[n.ten].thanh_tien += tien;
                theoNguoi[n.ten].ghi_chu.push(ct.id);
            });
        });

        Object.keys(theoNguoi).forEach((ten, idx) => {
            const info = theoNguoi[ten];
            bangCTP.push({
                stt: ('0' + (idx + 1)).slice(-2),
                ho_ten: ten,
                so_ngay: info.so_ngay,
                thanh_tien: info.thanh_tien.toLocaleString('vi-VN'),
                ghi_chu: info.ghi_chu.join(', ')
            });
        });

        const tongCTP = Object.values(theoNguoi).reduce((s, x) => s + x.thanh_tien, 0);

        const data = {
            ngay_lap: ngayLapObj.ngay, thang_lap: ngayLapObj.thang, nam_lap: ngayLapObj.nam,
            nguoi_de_nghi: nguoiDeNghi,
            bang_chi_phi: bangChiPhi,
            bang_ctp: bangCTP,
            tong_ctp: tongCTP.toLocaleString('vi-VN'),
            tong_toan_bo: tongToanBo.toLocaleString('vi-VN'),
            so_cong_tac: dsCTChon.length
        };

        try {
            const res = await fetch(`${GOOGLE_WEB_APP_URL}?action=getTemplate&fileId=${ID_TEMPLATE_TONG}`);
            const result = await res.json();
            const binary = window.atob(result.base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

            const zip = new PizZip(bytes.buffer);
            const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true, nullGetter: () => "" });
            doc.render(data);

            const blob = doc.getZip().generate({
                type: "blob",
                mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            });
            saveAs(blob, `Bang_thanh_toan_tong.docx`);
            document.getElementById("loading").style.display = "none";
        } catch (e) {
            console.error(e);
            alert("Lỗi: " + e.message);
            document.getElementById("loading").style.display = "none";
        }
    }

    // ============ ĐỊNH DẠNG ============
    function formatDate(str) {
        if (!str) return "";
        const d = new Date(str);
        if (isNaN(d)) return str;
        return `${('0'+d.getDate()).slice(-2)}/${('0'+(d.getMonth()+1)).slice(-2)}/${d.getFullYear()}`;
    }
    function splitDate(str) {
        if (!str) return { ngay: "", thang: "", nam: "" };
        const d = new Date(str);
        return { ngay: ('0'+d.getDate()).slice(-2), thang: ('0'+(d.getMonth()+1)).slice(-2), nam: d.getFullYear() };
    }
    function escapeHtml(str) {
        if (!str) return "";
        return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
</script>
